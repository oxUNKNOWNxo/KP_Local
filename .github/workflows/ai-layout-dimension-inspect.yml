name: Koishi AI layout dimension inspection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-layout-dimension-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: c1850e1120df6a5885692eadacad8ad114a3cf11
    steps:
      - uses: actions/checkout@v7
        with:
          path: control
      - uses: actions/cache/restore@v6
        with:
          path: source
          key: koishipro2-source-${{ env.SOURCE_COMMIT }}-v1
      - name: Inspect trans_AIroom geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("source/Assets/transUI/prefab/trans_AIroom.prefab")
          text=p.read_text(encoding="utf-8-sig",errors="replace")
          docs=re.split(r'(?=--- !u!)', text)
          gos={}
          transforms={}
          comps=[]
          for d in docs:
              m=re.match(r'--- !u!1 &(\d+)',d)
              if m:
                  fid=m.group(1)
                  n=re.search(r'\n  m_Name: (.+)',d)
                  if n: gos[fid]=n.group(1).strip()
                  continue
              m=re.match(r'--- !u!4 &(\d+)',d)
              if m:
                  fid=m.group(1)
                  go=re.search(r'm_GameObject: \{fileID: (\d+)\}',d)
                  fa=re.search(r'm_Father: \{fileID: (\d+)\}',d)
                  pos=re.search(r'm_LocalPosition: \{x: ([^,]+), y: ([^,]+), z: ([^}]+)\}',d)
                  scale=re.search(r'm_LocalScale: \{x: ([^,]+), y: ([^,]+), z: ([^}]+)\}',d)
                  transforms[fid]=(go.group(1) if go else "",fa.group(1) if fa else "0",pos.groups() if pos else None,scale.groups() if scale else None)
                  continue
              m=re.match(r'--- !u!114 &(\d+)',d)
              if m:
                  go=re.search(r'm_GameObject: \{fileID: (\d+)\}',d)
                  if not go: continue
                  w=re.search(r'mWidth: ([-0-9.]+)',d)
                  h=re.search(r'mHeight: ([-0-9.]+)',d)
                  script=re.search(r'm_Script: \{fileID: 11500000, guid: ([0-9a-f]+),',d)
                  comps.append((m.group(1),go.group(1),script.group(1) if script else "",w.group(1) if w else "",h.group(1) if h else ""))
          tf_by_go={v[0]:k for k,v in transforms.items() if v[0]}
          wanted={"trans_AIroom","GameObject","mainWindow","deck","panel_","bar_","btns","rank_","aideck_","unrand_","first_","start_","exit_","percyHint"}
          print("=== transforms ===")
          for go,name in gos.items():
              if name in wanted:
                  tf=tf_by_go.get(go)
                  print(name,"go",go,"tf",tf,"data",transforms.get(tf))
          print("=== widget-ish components on wanted objects ===")
          for cid,go,guid,w,h in comps:
              name=gos.get(go)
              if name in wanted and (w or h):
                  print(name,"comp",cid,"guid",guid,"w",w,"h",h)
          print("=== deck subtree objects ===")
          deck_go=next((go for go,n in gos.items() if n=="deck"),None)
          deck_tf=tf_by_go.get(deck_go)
          for go,name in gos.items():
              tf=tf_by_go.get(go)
              if not tf: continue
              father=transforms[tf][1]
              if father==deck_tf:
                  print("child",name,"go",go,"tf",tf,"data",transforms[tf])
          PY
