name: Koishi first-turn focused inspection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/first-turn-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: c1850e1120df6a5885692eadacad8ad114a3cf11
    steps:
      - uses: actions/checkout@v4
        with:
          path: control

      - uses: actions/cache/restore@v4
        with:
          path: source
          key: koishipro2-source-${{ env.SOURCE_COMMIT }}-v1

      - name: Inspect exact first-turn UI code
        shell: bash
        run: |
          set -euo pipefail
          test -f source/Assets/SibylSystem/Room/Room.cs
          echo '===== Room.cs 600-780 ====='
          sed -n '600,780p' source/Assets/SibylSystem/Room/Room.cs
          echo '===== first-turn method references ====='
          grep -RniE -C 8 --include='*.cs' 'StocMessage_SelectHand|StocMessage_HandResult|StocMessage_SelectTp|CtosMessage_HandResult|CtosMessage_TpResult|RockPaperScissors|HandResult' source/Assets/SibylSystem source/Assets/YGOSharp || true
          echo '===== AI room control labels ====='
          grep -n -B18 -A55 -E 'm_Name: (aideck_|rank_|life_|mr4_|unrand_|first_|god_)|mText:|m_Text:' source/Assets/ArtSystem/Room/new_room_ai.prefab || true
