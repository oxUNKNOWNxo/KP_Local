name: Unity service account test

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/unity-service-account-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-service-account:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      UNITY_CLI_HOME: /tmp/unity-cli
      UNITY_SERVICE_ACCOUNT_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_ID }}
      UNITY_SERVICE_ACCOUNT_SECRET: ${{ secrets.UNITY_SERVICE_ACCOUNT_SECRET }}
      UNITY_NO_CONSENT_PROMPT: '1'
      UNITY_NO_PAGER: '1'

    steps:
      - name: Verify GitHub secrets are present
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${UNITY_SERVICE_ACCOUNT_ID:-}" ]; then
            echo 'UNITY_SERVICE_ACCOUNT_ID is missing or empty.'
            exit 21
          fi
          if [ -z "${UNITY_SERVICE_ACCOUNT_SECRET:-}" ]; then
            echo 'UNITY_SERVICE_ACCOUNT_SECRET is missing or empty.'
            exit 22
          fi
          echo 'Both Unity service-account GitHub secrets are present.'

      - name: Install Unity CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://unity.com/install.sh | UNITY_CLI_CHANNEL=beta UNITY_CLI_HOME="$UNITY_CLI_HOME" bash >/dev/null
          test -x "$UNITY_CLI_HOME/bin/unity"
          echo 'Unity CLI installed.'

      - name: Verify unattended service-account authentication
        shell: bash
        run: |
          set -euo pipefail
          UNITY="$UNITY_CLI_HOME/bin/unity"
          AUTH_JSON="$RUNNER_TEMP/unity-auth-status.json"
          if ! "$UNITY" auth status --format json >"$AUTH_JSON" 2>"$RUNNER_TEMP/unity-auth-error.log"; then
            echo 'SERVICE_ACCOUNT_AUTH=FAILED'
            sed -E '/secret|token|authorization|bearer|key.?id|service.?account.?id/Id' "$RUNNER_TEMP/unity-auth-error.log" | tail -40 || true
            exit 31
          fi
          echo 'SERVICE_ACCOUNT_AUTH=OK'

      - name: Test Unity Personal activation through service account
        shell: bash
        run: |
          set -euo pipefail
          UNITY="$UNITY_CLI_HOME/bin/unity"
          ACTIVATE_JSON="$RUNNER_TEMP/unity-license-activate.json"
          ACTIVATE_ERR="$RUNNER_TEMP/unity-license-activate.err"
          set +e
          "$UNITY" license activate --personal --accept-eula --format json >"$ACTIVATE_JSON" 2>"$ACTIVATE_ERR"
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo 'SERVICE_ACCOUNT_PERSONAL_LICENSE=FAILED'
            sed -E '/secret|token|authorization|bearer|key.?id|service.?account.?id/Id' "$ACTIVATE_ERR" | tail -60 || true
            if [ -s "$ACTIVATE_JSON" ]; then
              python3 - <<'PY'
import json, os
p=os.environ['RUNNER_TEMP']+'/unity-license-activate.json'
try:
    d=json.load(open(p))
except Exception:
    print('Unity returned a non-JSON activation response; hidden to avoid leaking account data.')
    raise SystemExit
print('success:', d.get('success'))
for e in d.get('errors', []) or []:
    if isinstance(e, dict):
        msg=e.get('message') or e.get('code') or 'Unity activation error'
    else:
        msg=str(e)
    low=msg.lower()
    if not any(x in low for x in ('token','secret','authorization','bearer','key id','service account id')):
        print('error:', msg[:500])
PY
            fi
            exit "$STATUS"
          fi

          python3 - <<'PY'
import json, os, sys
p=os.environ['RUNNER_TEMP']+'/unity-license-activate.json'
d=json.load(open(p))
if not d.get('success', False):
    print('SERVICE_ACCOUNT_PERSONAL_LICENSE=FAILED')
    sys.exit(41)
print('SERVICE_ACCOUNT_PERSONAL_LICENSE=OK')
PY

      - name: Verify active license state
        shell: bash
        run: |
          set -euo pipefail
          UNITY="$UNITY_CLI_HOME/bin/unity"
          STATUS_JSON="$RUNNER_TEMP/unity-license-status.json"
          "$UNITY" license status --format json >"$STATUS_JSON"
          python3 - <<'PY'
import json, os, sys
p=os.environ['RUNNER_TEMP']+'/unity-license-status.json'
d=json.load(open(p))
text=json.dumps(d).lower()
if 'unity personal' not in text:
    print('ACTIVE_UNITY_PERSONAL=NOT_CONFIRMED')
    sys.exit(51)
print('ACTIVE_UNITY_PERSONAL=OK')
PY
