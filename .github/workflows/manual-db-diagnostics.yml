name: KoishiPro2 manual database CDN diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/manual-db-diagnostics.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe HEAD and GET as used by the Unity card downloader
        shell: bash
        run: |
          set -u
          for host in \
            https://cdntx2.moecube.com/koishipro/content \
            https://cdn01.moestart.com/koishipro/ygopro-database/zh-CN \
            http://cdn01.moestart.com/koishipro/ygopro-database/zh-CN; do
            for filename in cards.cdb lflist.conf strings.conf; do
              url="$host/$filename"
              echo "=== $url ==="
              echo -n 'HEAD: '
              curl --max-time 15 -L -I -sS -o /dev/null -w 'HTTP %{http_code}, length %{content_length_download}, effective %{url_effective}\n' "$url" || true
              echo -n 'GET: '
              tmp=$(mktemp)
              curl --max-time 20 -L -sS --range 0-47 -o "$tmp" -w 'HTTP %{http_code}, bytes %{size_download}, effective %{url_effective}\n' "$url" || true
              echo -n 'first 16 bytes (hex): '
              head -c 16 "$tmp" | od -An -tx1
              rm -f "$tmp"
            done
          done
      - name: Inspect fixed program from existing cache when available
        uses: actions/cache/restore@v4
        with:
          path: source
          key: koishipro2-source-c1850e1120df6a5885692eadacad8ad114a3cf11-v1
      - name: Inspect installed update code without new network fetch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/Assets/SibylSystem/Program.cs')
          if not p.exists():
              print('No upstream source cache available; previous workflow logs cover fixed Program.cs.')
          else:
              s=p.read_text(encoding='utf-8-sig').splitlines()
              for i,x in enumerate(s):
                  if 'RetryBasicDataUpdate()' in x or 'UpdateClientCoroutine()' in x or 'koishipro/content' in x:
                      print('\n'.join('%s %s' % (k+1,s[k]) for k in range(max(0,i-5),min(len(s),i+10))))
          PY
