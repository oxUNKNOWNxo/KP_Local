name: WindBot local duel smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/windbot-duel-smoke.yml'
      - 'windbot/runtime/**'
      - 'windbot/prepare_windbot_subset.sh'

permissions:
  contents: read

concurrency:
  group: windbot-local-duel-smoke
  cancel-in-progress: true

jobs:
  duel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4

      - name: Install host build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl mono-devel mono-utils sqlite3

      - name: Prepare WindBot managed subset
        shell: bash
        run: |
          set -euo pipefail
          chmod +x windbot/prepare_windbot_subset.sh
          windbot/prepare_windbot_subset.sh "$RUNNER_TEMP/subset"

      - name: Resolve current Koishi runtime
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/host-runtime"
          mkdir -p "$ROOT"

          fetch_head() {
            local repo="$1"
            local dir="$2"
            mkdir -p "$dir"
            git -C "$dir" init -q
            git -C "$dir" remote add origin "$repo"
            git -C "$dir" fetch --quiet --no-tags --depth=1 origin master
            git -C "$dir" checkout --quiet --detach FETCH_HEAD
          }
          fetch_commit() {
            local repo="$1"
            local sha="$2"
            local dir="$3"
            mkdir -p "$dir"
            git -C "$dir" init -q
            git -C "$dir" remote add origin "$repo"
            git -C "$dir" fetch --quiet --no-tags --depth=1 origin "$sha"
            git -C "$dir" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          }

          fetch_head https://github.com/purerosefallen/ygopro.git "$ROOT/ygopro"
          YGOPRO_SHA=$(git -C "$ROOT/ygopro" rev-parse HEAD)
          CORE_SHA=$(git -C "$ROOT/ygopro" ls-tree "$YGOPRO_SHA" ocgcore | awk '{print $3}')
          SCRIPT_SHA=$(git -C "$ROOT/ygopro" ls-tree "$YGOPRO_SHA" script | awk '{print $3}')
          test -n "$CORE_SHA"
          test -n "$SCRIPT_SHA"
          fetch_commit https://github.com/purerosefallen/ygopro-core.git "$CORE_SHA" "$ROOT/core"
          fetch_commit https://github.com/Smile-DK/ygopro-scripts.git "$SCRIPT_SHA" "$ROOT/script"

          printf 'ygopro=%s\nocgcore=%s\nscript=%s\n' "$YGOPRO_SHA" "$CORE_SHA" "$SCRIPT_SHA" | tee "$ROOT/revisions.txt"

          curl --fail --location --retry 4 --retry-delay 2 \
            https://www.lua.org/ftp/lua-5.4.8.tar.gz -o "$ROOT/lua.tar.gz"
          echo '4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae  '"$ROOT/lua.tar.gz" | sha256sum -c -
          tar -xzf "$ROOT/lua.tar.gz" -C "$ROOT"

          curl --fail --location --retry 4 --retry-delay 2 \
            https://cdntx2.moecube.com/koishipro/content/cards.cdb -o "$ROOT/cards.cdb"
          sqlite3 "$ROOT/cards.cdb" 'select count(*) from datas;'
          test "$(sqlite3 "$ROOT/cards.cdb" 'select count(*) from datas;')" -gt 10000

      - name: Build current Koishi core for host
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/host-runtime"
          CORE="$ROOT/core"
          LUA="$ROOT/lua-5.4.8/src"
          OBJ="$ROOT/obj"
          mkdir -p "$OBJ/core" "$OBJ/lua"

          COMMON=(-O2 -fPIC -fvisibility=hidden -I"$CORE" -I"$LUA")
          while IFS= read -r src; do
            base=$(basename "$src" .cpp)
            g++ "${COMMON[@]}" -std=c++14 -DOCGCORE_EXPORT_FUNCTIONS -c "$src" -o "$OBJ/core/$base.o"
          done < <(find "$CORE" -maxdepth 1 -type f -name '*.cpp' | sort)

          while IFS= read -r src; do
            base=$(basename "$src" .c)
            case "$base" in
              lua|luac|onelua|linit|loslib) continue ;;
            esac
            g++ "${COMMON[@]}" -x c++ -std=c++14 -DLUA_USE_POSIX -c "$src" -o "$OBJ/lua/$base.o"
          done < <(find "$LUA" -maxdepth 1 -type f -name '*.c' | sort)

          g++ -shared -o "$ROOT/libkoishi_ocgcore.so" "$OBJ"/core/*.o "$OBJ"/lua/*.o -ldl -lm
          test -s "$ROOT/libkoishi_ocgcore.so"
          nm -D "$ROOT/libkoishi_ocgcore.so" | grep ' create_duel_v2$'
          nm -D "$ROOT/libkoishi_ocgcore.so" | grep ' process$'

      - name: Assemble smoke-test data
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/host-runtime"
          cp -R "$RUNNER_TEMP/subset/data/Decks" "$ROOT/Decks"
          cp -R "$RUNNER_TEMP/subset/data/Dialogs" "$ROOT/Dialogs"
          test -s "$ROOT/Decks/AI_RadiantTyphoon.ydk"
          test -s "$ROOT/Decks/AI_BlueEyes.ydk"
          cp "$RUNNER_TEMP/subset/data/deck-catalog.tsv" "$ROOT/deck-catalog.tsv"
          test -s "$ROOT/deck-catalog.tsv"
          test -s "$ROOT/Dialogs/wof-Kasumisawa-Haruma.json"
          test -s "$ROOT/script/constant.lua"
          test -s "$ROOT/script/utility.lua"
          test -s "$ROOT/script/procedure.lua"
          test -s "$ROOT/script/patches/entry.lua"

          # Expansion-only proof card: this ID is intentionally absent from
          # the downloaded base cards.cdb. It verifies that local WindBot and
          # ocgcore can consume data/scripts for newly announced cards from
          # expansions without overriding the bundled database.
          mkdir -p "$ROOT/expansions/scripts"
          sqlite3 "$ROOT/expansions/early-card.cdb" <<'SQL'
          CREATE TABLE datas (
            id integer primary key,
            ot integer,
            alias integer,
            setcode integer,
            type integer,
            atk integer,
            def integer,
            level integer,
            race integer,
            attribute integer,
            category integer
          );
          CREATE TABLE texts (
            id integer primary key,
            name text,
            desc text
          );
          INSERT INTO datas VALUES (19999999, 1, 0, 0, 33, 1200, 800, 4, 1, 1, 0);
          INSERT INTO texts VALUES (19999999, 'Expansion Smoke Monster', 'Expansion-only smoke card.');
          SQL
          cat > "$ROOT/expansions/scripts/c19999999.lua" <<'LUA'
          local s,id=GetID()
          function s.initial_effect(c)
          end
          LUA
          test "$(sqlite3 "$ROOT/cards.cdb" 'select count(*) from datas where id=19999999;')" -eq 0
          test "$(sqlite3 "$ROOT/expansions/early-card.cdb" 'select count(*) from datas where id=19999999 and (type & 1) != 0;')" -eq 1

          missing=0
          while read -r id; do
            [ -z "$id" ] && continue
            found=$(sqlite3 "$ROOT/cards.cdb" "select count(*) from datas where id=$id;")
            if [ "$found" -ne 1 ]; then
              echo "RadiantTyphoon card is missing from current cards.cdb: $id"
              missing=$((missing + 1))
            fi
          done < <(grep -E '^[0-9]+$' "$ROOT/Decks/AI_RadiantTyphoon.ydk" | sort -nu)
          test "$missing" -eq 0

      - name: Compile local duel harness
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/host-runtime"
          cat > "$ROOT/Smoke.cs" <<'CS'
          using System;
          using System.Collections.Generic;
          using System.IO;
          using System.Reflection;
          using KoishiWindBot.Local;
          using WindBot.Local;

          public static class Smoke
          {
              private const int Chant = 67115133;
              private const int ExpansionMonster = 19999999;
              private const byte MsgSelectBattleCmd = 10;
              private const byte MsgSelectIdleCmd = 11;
              private const byte MsgSelectEffectYn = 12;
              private const byte MsgSelectYesNo = 13;
              private const byte MsgSelectOption = 14;
              private const byte MsgSelectChain = 16;
              private const byte MsgChaining = 70;

              private static byte[] LastHumanMessage;
              private static int HumanMessages;
              private static bool SawChantActivation;

              private static void LoadYdk(string path, out List<int> main, out List<int> extra)
              {
                  main = new List<int>();
                  extra = new List<int>();
                  int section = 0;
                  foreach (string raw in File.ReadAllLines(path))
                  {
                      string line = raw.Trim();
                      if (line == "#main") { section = 0; continue; }
                      if (line == "#extra") { section = 1; continue; }
                      if (line == "!side") { section = 2; continue; }
                      if (line.Length == 0 || line[0] == '#') continue;
                      int id;
                      if (!Int32.TryParse(line, out id) || section == 2) continue;
                      if (section == 1) extra.Add(id); else main.Add(id);
                  }
              }

              private static bool ContainsInt32(byte[] packet, int value)
              {
                  byte[] needle = BitConverter.GetBytes(value);
                  for (int i = 0; i + 4 <= packet.Length; ++i)
                  {
                      if (packet[i] == needle[0] && packet[i + 1] == needle[1] &&
                          packet[i + 2] == needle[2] && packet[i + 3] == needle[3])
                          return true;
                  }
                  return false;
              }

              private static void OnHumanMessage(byte[] packet)
              {
                  HumanMessages++;
                  LastHumanMessage = packet;
                  byte type = packet != null && packet.Length > 0 ? packet[0] : (byte)0;
                  if (type == MsgChaining && ContainsInt32(packet, Chant))
                  {
                      SawChantActivation = true;
                      Console.WriteLine("SMOKE: RadiantTyphoonChant activation observed.");
                  }
              }

              private static byte[] DefaultHumanResponse(byte type)
              {
                  switch (type)
                  {
                      case MsgSelectChain:
                          return BitConverter.GetBytes(-1);
                      case MsgSelectEffectYn:
                      case MsgSelectYesNo:
                      case MsgSelectOption:
                          return BitConverter.GetBytes(0);
                      default:
                          return null;
                  }
              }

              public static int Main()
              {
                  try
                  {
                      List<int> main;
                      List<int> extra;
                      LoadYdk(Path.Combine("Decks", "AI_RadiantTyphoon.ydk"), out main, out extra);
                      Console.WriteLine("proof deck main=" + main.Count + " extra=" + extra.Count);
                      main.Add(ExpansionMonster);

                      var blueEyesRuntime = new WindBotLocalRuntime(
                          Directory.GetCurrentDirectory(),
                          Path.Combine(Directory.GetCurrentDirectory(), "cards.cdb"),
                          "Blue-Eyes",
                          "AI_BlueEyes",
                          packet => { });
                      if (blueEyesRuntime.ExecutorName != "BlueEyesExecutor")
                          throw new Exception("Blue-Eyes executor registry mismatch: " + blueEyesRuntime.ExecutorName);

                      string[] registeredDecks = WindBot.Game.AI.DecksManager.GetDeckNames();
                      if (registeredDecks.Length < 20)
                          throw new Exception("Too few WindBot decks registered: " + registeredDecks.Length);
                      if (WindBot.Game.AI.DecksManager.GetDeckFile("RadiantTyphoon") != "AI_RadiantTyphoon")
                          throw new Exception("RadiantTyphoon deck-file mapping is incorrect.");
                      Console.WriteLine("SMOKE: multi-deck registry verified; count=" + registeredDecks.Length);

                      LocalDuelNative.CardProvider hostCardProvider = code =>
                      {
                          if (code != ExpansionMonster)
                              return null;
                          return new CardRecord
                          {
                              Code = ExpansionMonster,
                              Alias = 0,
                              Setcode = 0,
                              Type = 33,
                              Level = 4,
                              Attribute = 1,
                              Race = 1,
                              Attack = 1200,
                              Defense = 800,
                              LScale = 0,
                              RScale = 0,
                              LinkMarker = 0,
                              RuleCode = 0
                          };
                      };

                      using (var duel = new RadiantTyphoonLocalDuel(
                          Directory.GetCurrentDirectory(),
                          Path.Combine(Directory.GetCurrentDirectory(), "cards.cdb"),
                          "RadiantTyphoon",
                          "AI_RadiantTyphoon",
                          OnHumanMessage,
                          log => Console.WriteLine(log),
                          hostCardProvider,
                          false))
                      {
                          var windBotExpansionCard = KoishiWindBot.OCGWrapper.Card.Get(ExpansionMonster);
                          if (windBotExpansionCard != null)
                              throw new Exception("Expansion-only card unexpectedly leaked into WindBot's bundled database.");

                          MethodInfo resolver = typeof(LocalDuelNative).GetMethod(
                              "ResolveScriptPath",
                              BindingFlags.NonPublic | BindingFlags.Static);
                          string resolvedScript = (string)resolver.Invoke(
                              null,
                              new object[] { "./script/c" + ExpansionMonster + ".lua" });
                          string expectedScript = Path.Combine(
                              Directory.GetCurrentDirectory(),
                              "expansions",
                              "scripts",
                              "c" + ExpansionMonster + ".lua");
                          if (!string.Equals(
                              Path.GetFullPath(resolvedScript),
                              Path.GetFullPath(expectedScript),
                              StringComparison.Ordinal))
                              throw new Exception("Expansion card script fallback did not resolve correctly: " + resolvedScript);

                          Console.WriteLine("SMOKE: host card-data fallback and expansion script fallback verified.");

                          // AI goes first and the deck is not shuffled. In the current
                          // WindBot YDK this puts Radiant Typhoon Chant in the opening
                          // hand, exercising the effect that stalled on iPhone.
                          duel.Start(main, extra, true, 8000, 5, 1, 5);

                          bool reachedHumanMainPhase = false;
                          for (int guard = 0; guard < 200 && !duel.IsEnded; ++guard)
                          {
                              if (duel.WaitingPlayer == 0)
                              {
                                  throw new Exception(
                                      "WindBot stalled waiting for its own response. lastHumanType=" +
                                      (LastHumanMessage == null ? -1 : LastHumanMessage[0]));
                              }

                              if (duel.WaitingPlayer != 1)
                                  continue;

                              if (LastHumanMessage == null || LastHumanMessage.Length == 0)
                                  throw new Exception("Human response requested without a game message.");

                              byte type = LastHumanMessage[0];
                              if (type == MsgSelectIdleCmd || type == MsgSelectBattleCmd)
                              {
                                  reachedHumanMainPhase = true;
                                  Console.WriteLine("SMOKE: AI turn completed; human command boundary reached.");
                                  break;
                              }

                              byte[] response = DefaultHumanResponse(type);
                              if (response == null)
                              {
                                  throw new Exception(
                                      "Unexpected human decision during AI-turn smoke: MSG_" + type);
                              }

                              Console.WriteLine("SMOKE: auto-decline human MSG_" + type);
                              duel.SubmitHumanResponse(response);
                          }

                          Console.WriteLine("ended=" + duel.IsEnded
                              + " waitingPlayer=" + duel.WaitingPlayer
                              + " humanMessages=" + HumanMessages
                              + " sawChant=" + SawChantActivation);

                          if (!SawChantActivation)
                              throw new Exception("Deterministic AI turn never activated Radiant Typhoon Chant.");
                          if (!duel.IsEnded && !reachedHumanMainPhase)
                              throw new Exception("AI turn did not finish after Radiant Typhoon Chant.");
                          if (HumanMessages < 10)
                              throw new Exception("Too few game messages reached the human client.");
                      }

                      Console.WriteLine("WINDBOT_CHANT_TURN_SMOKE_OK");
                      return 0;
                  }
                  catch (Exception ex)
                  {
                      Console.Error.WriteLine(ex);
                      return 1;
                  }
              }
          }
          CS
          # Mono on Linux does not consistently apply lib*.so name mapping
          # for this P/Invoke name. Keep production code unchanged (__Internal
          # on iOS), but make the host-only smoke build name explicit.
          python3 - "$RUNNER_TEMP/subset/src/LocalRuntime/LocalDuelNative.cs" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8-sig')
          old = 'private const string NativeLibrary = "koishi_ocgcore";'
          new = 'private const string NativeLibrary = "libkoishi_ocgcore.so";'
          if old not in text:
              raise SystemExit('host P/Invoke library anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          ldd "$ROOT/libkoishi_ocgcore.so"
          python3 - "$ROOT/libkoishi_ocgcore.so" <<'PY'
          import ctypes
          import sys
          ctypes.CDLL(sys.argv[1])
          print('ctypes native load ok')
          PY

          mapfile -t SOURCES < <(find "$RUNNER_TEMP/subset/src" -type f -name '*.cs' | sort)
          mcs -unsafe -langversion:latest -optimize+ \
            -out:"$ROOT/Smoke.exe" \
            -r:System.Core -r:System.Data -r:System.Runtime.Serialization -r:Mono.Data.Sqlite \
            "${SOURCES[@]}" "$ROOT/Smoke.cs"
          test -s "$ROOT/Smoke.exe"

      - name: Run AI-first local duel
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/host-runtime"
          cd "$ROOT"
          LD_LIBRARY_PATH="$ROOT" mono "$ROOT/Smoke.exe" | tee "$ROOT/smoke.log"
          grep -q 'SMOKE: multi-deck registry verified;' "$ROOT/smoke.log"
          grep -q 'SMOKE: host card-data fallback and expansion script fallback verified.' "$ROOT/smoke.log"
          grep -q 'WINDBOT_CHANT_TURN_SMOKE_OK' "$ROOT/smoke.log"

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindBot-local-duel-smoke
          path: |
            ${{ runner.temp }}/host-runtime/revisions.txt
            ${{ runner.temp }}/host-runtime/smoke.log
          if-no-files-found: warn
          retention-days: 2
