name: KoishiPro2 AI core iOS probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ai-core-ios-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      CORE_REPO: https://github.com/Heavenswind/YGOProUnity_V2.git
      CORE_COMMIT: c00c90cff77f5e3c65d217597481a065404ed94b
    steps:
      - name: Fetch matching legacy AI core source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source probe
          mkdir source probe
          git -C source init -q
          git -C source remote add origin "$CORE_REPO"
          git -C source fetch --quiet --no-tags --depth=1 origin "$CORE_COMMIT"
          git -C source checkout --quiet --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$CORE_COMMIT"
          printf '%s\n' "$CORE_COMMIT" > probe/CORE_COMMIT.txt

      - name: Apply iOS portability patch
        shell: bash
        run: |
          set -euo pipefail
          CORE="$GITHUB_WORKSPACE/source/AI_core_vs2017solution/ocgcore"
          python3 - <<'PY'
          from pathlib import Path

          h = Path('source/AI_core_vs2017solution/ocgcore/ocgapi.h')
          s = h.read_text(encoding='utf-8-sig')
          old = '#define WIN32\n#include "common.h"\n#ifdef WIN32\n#include <windows.h>\n#define DECL_DLLEXPORT __declspec(dllexport)\n#else\n#define DECL_DLLEXPORT\n#endif'
          new = '#include "common.h"\n#if defined(_WIN32) || defined(WIN32)\n#include <windows.h>\n#define DECL_DLLEXPORT __declspec(dllexport)\n#else\n#define DECL_DLLEXPORT __attribute__((visibility("default")))\n#endif'
          if old not in s:
              raise SystemExit('Expected Windows-only export block not found')
          h.write_text(s.replace(old, new, 1), encoding='utf-8')

          los = Path('source/AI_core_vs2017solution/ocgcore/loslib.c')
          s = los.read_text(encoding='utf-8-sig')
          old = '''static int os_execute (lua_State *L) {
  const char *cmd = luaL_optstring(L, 1, NULL);
  int stat = system(cmd);
  if (cmd != NULL)
    return luaL_execresult(L, stat);
  else {
    lua_pushboolean(L, stat);  /* true if there is a shell */
    return 1;
  }
}'''
          new = '''static int os_execute (lua_State *L) {
#if defined(__APPLE__) && defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)
  (void)L;
  lua_pushnil(L);
  lua_pushliteral(L, "os.execute is unavailable on iOS");
  return 2;
#else
  const char *cmd = luaL_optstring(L, 1, NULL);
  int stat = system(cmd);
  if (cmd != NULL)
    return luaL_execresult(L, stat);
  else {
    lua_pushboolean(L, stat);  /* true if there is a shell */
    return 1;
  }
#endif
}'''
          if old not in s:
              raise SystemExit('Expected Lua os_execute implementation not found')
          los.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          {
            echo '=== ocgapi portability ==='
            grep -nE 'windows.h|DECL_DLLEXPORT|define WIN32' "$CORE/ocgapi.h" || true
            echo '=== iOS os.execute guard ==='
            grep -n -A18 'static int os_execute' "$CORE/loslib.c" || true
          } | tee probe/portability-patch.txt

      - name: Build ocgcore static library for iOS arm64
        shell: bash
        run: |
          set -euo pipefail
          CORE="$GITHUB_WORKSPACE/source/AI_core_vs2017solution/ocgcore"
          test -d "$CORE"
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          CLANGXX="$(xcrun --sdk iphoneos --find clang++)"
          AR="$(xcrun --sdk iphoneos --find ar)"
          mkdir -p probe/obj

          echo "SDKROOT=$SDKROOT" | tee probe/build-info.txt
          "$CLANG" --version >> probe/build-info.txt
          find "$CORE" -maxdepth 1 -type f \( -name '*.cpp' -o -name '*.c' \) -print | sort > probe/sources.txt
          cat probe/sources.txt

          COMMON=( -arch arm64 -isysroot "$SDKROOT" -miphoneos-version-min=13.0 -O2 -fPIC -fvisibility=hidden -I"$CORE" )

          while IFS= read -r src; do
            base="$(basename "$src")"
            obj="probe/obj/${base%.*}.o"
            case "$src" in
              *.cpp)
                "$CLANGXX" "${COMMON[@]}" -std=gnu++11 -Wno-deprecated-declarations -c "$src" -o "$obj"
                ;;
              *.c)
                "$CLANG" "${COMMON[@]}" -std=gnu99 -Wno-deprecated-declarations -c "$src" -o "$obj"
                ;;
            esac
          done < probe/sources.txt

          "$AR" rcs probe/libocgcore.a probe/obj/*.o
          file probe/libocgcore.a | tee -a probe/build-info.txt
          xcrun nm -gU probe/libocgcore.a | grep -E '(_create_duel|_process|_set_response|_query_|_set_chat_handler|_preload_script)' | head -160 | tee probe/exported-symbols.txt
          grep -q '_create_duel' probe/exported-symbols.txt
          grep -q '_set_chat_handler' probe/exported-symbols.txt
          grep -q '_preload_script' probe/exported-symbols.txt
          ls -lh probe/libocgcore.a

      - name: Upload probe package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KoishiPro2-ai-core-ios-probe
          path: probe
          if-no-files-found: warn
          retention-days: 1
