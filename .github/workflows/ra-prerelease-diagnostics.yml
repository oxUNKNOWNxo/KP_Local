name: KoishiPro2 Sun God prerelease diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ra-prerelease-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch official Koishi super-prerelease archive
        shell: bash
        run: |
          set -euo pipefail
          for u in \
            https://cdntx2.moecube.com/ygopro-super-pre/archive/ygopro-super-pre.ypk \
            https://cdn02.moecube.com:444/ygopro-super-pre/archive/ygopro-super-pre.ypk; do
            if curl -fLsS --connect-timeout 10 --max-time 150 --retry 2 -o /tmp/super-pre.ypk "$u"; then
              echo "Downloaded $(stat -c%s /tmp/super-pre.ypk) bytes from $u"
              break
            fi
          done
          test -s /tmp/super-pre.ypk
      - name: Download current official basic cards database
        shell: bash
        run: |
          curl -fLsS --connect-timeout 10 --max-time 100 --retry 2 \
            -o /tmp/current-cards.cdb \
            'https://cdn01.moestart.com/koishipro/ygopro-database/zh-CN/cards.cdb'
          sqlite3 /tmp/current-cards.cdb 'PRAGMA quick_check;'
      - name: Compare actual official Ra records and archive overrides
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sqlite3,zipfile,tempfile
          ids=(10000010,10000011,10000012,10000013,10000014,10000015,10000080,10000090,101307030,101307051,101307052,3016)
          dbs=[('main',Path('/tmp/current-cards.cdb'))]
          with zipfile.ZipFile('/tmp/super-pre.ypk') as z, tempfile.TemporaryDirectory() as d:
              for name in ['test-release.cdb','test-update.cdb']:
                  path=Path(d)/name
                  path.write_bytes(z.read(name))
                  dbs.append((name,path))
              for label,path in dbs:
                  con=sqlite3.connect(str(path))
                  print('DATABASE',label,'bytes',path.stat().st_size)
                  for code in ids:
                      data=con.execute('SELECT id,alias,setcode,type FROM datas WHERE id=?',(code,)).fetchone()
                      title=con.execute('SELECT name FROM texts WHERE id=?',(code,)).fetchone()
                      if data:
                          print('RA DATA',label,code,'alias',data[1],'setcode',data[2],hex(data[2]) if isinstance(data[2],int) else '', 'type',data[3], 'name',title[0] if title else '')
                  print('DB count',con.execute('select count(*) from datas').fetchone()[0])
                  con.close()
          PY
      - name: Inspect Ra and new Sun God card conditions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,sqlite3,re,tempfile
          path=Path('/tmp/super-pre.ypk')
          print('zip archive:',zipfile.is_zipfile(path))
          if not zipfile.is_zipfile(path):
              print('First bytes:',path.read_bytes()[:48].hex())
              raise SystemExit(0)
          with zipfile.ZipFile(path) as z:
              for script_name in ('script/c101307052.lua','script/c101307051.lua','script/c101307030.lua'):
                  if script_name in z.namelist():
                      print('FULL SCRIPT',script_name)
                      for line_no,ln in enumerate(z.read(script_name).decode('utf-8-sig',errors='replace').splitlines(),1):
                          print(f'{line_no:04d} {ln}')
              entries=z.namelist()
              print('Archive entries',len(entries))
              cdbs=[x for x in entries if x.lower().endswith(('.cdb','.db'))]
              print('CDBs:',cdbs[:30])
              scripts={x for x in entries if x.lower().endswith('.lua')}
              ids=set()
              for fn in cdbs:
                  with tempfile.TemporaryDirectory() as d:
                      f=Path(d)/'db.cdb'
                      f.write_bytes(z.read(fn))
                      try:
                          con=sqlite3.connect(str(f))
                          cols=[c[1] for c in con.execute('pragma table_info(texts)').fetchall()]
                          if 'name' not in cols: continue
                          for drow in con.execute('select id,alias,setcode,type from datas where id in (3016,10000010,10000011,101307052,101307051,101307030)').fetchall():print('DATA',fn,drow)
                          rows=con.execute('select id,name from texts where name like ? or name like ? or name like ? or name like ? or name like ?',('%太阳神%','%太陽神%','%翼神龙%','%翼神竜%','%ラー%')).fetchall()
                          con.close()
                          for id,name in rows:
                              ids.add(id);print('CARD',fn,id,repr(name))
                      except Exception as e:print('DB read failed',fn,str(e)[:160])
              for id in sorted(ids):
                  hits=[s for s in scripts if s.endswith('/c'+str(id)+'.lua') or s=='c'+str(id)+'.lua']
                  for fn in hits:
                      src=z.read(fn).decode('utf-8-sig',errors='replace')
                      print('SCRIPT',fn,'length',len(src))
                      for i,line in enumerate(src.splitlines(),1):
                          if re.search(r'IsCode|IsSetCard|IsFusionSetCard|3016|10000010|0x1e7|aux\.IsCode|GetCode|GetOriginalCode|LOCATION_DECK|IsAbleToGraveAsCost',line,re.I):
                              print(f'  {i}: {line[:220]}')
              print('Scripts referenced by card ID',len(ids))
          PY
