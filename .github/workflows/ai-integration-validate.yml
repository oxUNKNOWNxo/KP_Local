name: KoishiPro2 offline AI integration validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ai-integration-validate.yml'
      - 'patches/apply_ios_mods.py'
      - 'patches/finalize_offline_ai.py'
      - 'patches/build_ai_core_ios.sh'
      - 'patches/prepare_ai_pack.sh'
      - 'patches/ai/**'
      - 'patches/ios/**'

permissions:
  contents: read

concurrency:
  group: koishipro2-ai-integration-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      SOURCE_REPO: https://code.moenext.com/hex/ygopro2.git
      SOURCE_COMMIT: c1850e1120df6a5885692eadacad8ad114a3cf11
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4
        with:
          path: control

      - name: Fetch exact KoishiPro2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          mkdir source
          git -C source init -q
          git -C source remote add origin "$SOURCE_REPO"
          git -C source config http.version HTTP/1.1
          fetched=0
          for attempt in 1 2 3 4 5; do
            echo "Fetch attempt $attempt/5"
            if git -C source fetch --quiet --no-tags --depth=1 origin "$SOURCE_COMMIT"; then
              fetched=1
              break
            fi
            [ "$attempt" -eq 5 ] || sleep 5
          done
          test "$fetched" -eq 1
          git -C source checkout --quiet --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Apply DB and offline AI restoration patches
        shell: bash
        run: |
          set -euo pipefail
          python3 control/patches/apply_ios_mods.py source
          python3 control/patches/finalize_offline_ai.py source

      - name: Prepare bundled offline AI data pack
        shell: bash
        run: |
          set -euo pipefail
          bash control/patches/prepare_ai_pack.sh source
          PACK='source/Assets/StreamingAssets/koishi-ai-pack.zip'
          test -s "$PACK"
          unzip -l "$PACK" | grep -q 'ai/ai.lua'
          unzip -l "$PACK" | grep -q 'ai/decks/Blackwing.lua'
          unzip -l "$PACK" | grep -q 'ai/ydk/Blackwing.ydk'
          unzip -l "$PACK" | grep -q 'ai/ydk/Shaddoll.ydk'
          echo 'Bundled AI data pack validation passed.'

      - name: Validate restored managed AI integration
        shell: bash
        run: |
          set -euo pipefail
          CORE='source/Assets/SibylSystem/coreWrapper.cs'
          PRECY='source/Assets/SibylSystem/precy.cs'
          AIROOM='source/Assets/SibylSystem/Room/AIRoom.cs'
          BOOTSTRAP='source/Assets/SibylSystem/AIBootstrap.cs'
          MENU='source/Assets/SibylSystem/Menu/Menu.cs'
          PROGRAM='source/Assets/SibylSystem/Program.cs'
          VIEWPORT='source/Assets/Plugins/iOS/KoishiViewport.mm'

          for f in "$CORE" "$PRECY" "$AIROOM" "$BOOTSTRAP" "$MENU" "$PROGRAM" "$VIEWPORT"; do test -s "$f"; done

          grep -q 'OcgCoreLibrary = "__Internal"' "$CORE"
          grep -q 'AOT.MonoPInvokeCallback(typeof(CardReader))' "$CORE"
          grep -q 'AOT.MonoPInvokeCallback(typeof(MessageHandler))' "$CORE"
          grep -q 'Marshal.WriteByte(ptrFileName, s.Length, 0)' "$CORE"
          grep -q 'Marshal.AllocHGlobal(s.Length + 1)' "$CORE"
          ! grep -q '\[DllImport("ocgcore"' "$CORE"
          grep -q 'class PrecyOcg' "$PRECY"
          grep -q 'new Percy.smallYgopro' "$PRECY"
          grep -q 'new PrecyOcg()' "$AIROOM"
          grep -q 'AIBootstrap.EnsureInstalled()' "$AIROOM"
          grep -q 'startAI(' "$AIROOM"
          grep -q 'AIデータが見つかりません' "$AIROOM"
          grep -q 'koishi-ai-pack.zip' "$BOOTSTRAP"
          grep -Eq 'UIHelper\.registEvent\(gameObject,[[:space:]]*"ai_",[[:space:]]*onClickAI\);' "$MENU"
          grep -Eq 'UIHelper\.registEvent\(gameObject,[[:space:]]*"single_",[[:space:]]*onClickAI\);' "$MENU"
          grep -q 'labels\[j\].text = "AI対戦"' "$MENU"
          grep -q 'shiftToServant(Program.I().aiRoom)' "$MENU"
          grep -q 'UseBundledBasicData();' "$PROGRAM"
          ! grep -Eq '^[[:space:]]*RetryBasicDataUpdate\(\);[[:space:]]*$' "$PROGRAM"
          grep -q 'UnityGetGLView' "$VIEWPORT"
          grep -q 'targetAspect = 16.0 / 9.0' "$VIEWPORT"

          echo 'Managed AI/menu/native viewport validation passed.'

      - name: Compile-check native iOS viewport
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANGXX="$(xcrun --sdk iphoneos --find clang++)"
          "$CLANGXX" \
            -arch arm64 \
            -isysroot "$SDKROOT" \
            -miphoneos-version-min=13.0 \
            -fobjc-arc \
            -fsyntax-only \
            -x objective-c++ \
            source/Assets/Plugins/iOS/KoishiViewport.mm
          echo 'Native viewport Objective-C++ syntax validation passed.'

      - name: Build and validate ARM64 iOS AI core
        shell: bash
        run: |
          set -euo pipefail
          bash control/patches/build_ai_core_ios.sh source
          test -s source/Assets/Plugins/iOS/libocgcore.a
          file source/Assets/Plugins/iOS/libocgcore.a
          xcrun nm -gU source/Assets/Plugins/iOS/libocgcore.a > "$RUNNER_TEMP/ai-core-symbols.txt"
          for symbol in _create_duel _preload_script _set_ai_id _set_chat_handler _get_ai_going_first_second; do
            grep -q "$symbol" "$RUNNER_TEMP/ai-core-symbols.txt"
          done
          echo 'Native ARM64 iOS AI core validation passed.'

      - name: Upload validation snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KoishiPro2-ai-integration-validation
          path: |
            source/Assets/SibylSystem/coreWrapper.cs
            source/Assets/SibylSystem/precy.cs
            source/Assets/SibylSystem/Room/AIRoom.cs
            source/Assets/SibylSystem/AIBootstrap.cs
            source/Assets/SibylSystem/Menu/Menu.cs
            source/Assets/Plugins/iOS/KoishiViewport.mm
            source/Assets/Plugins/iOS/libocgcore.a
            source/Assets/Plugins/iOS/ocgcore-LICENSE.txt
            source/Assets/StreamingAssets/koishi-ai-pack.zip
          if-no-files-found: warn
          retention-days: 1
