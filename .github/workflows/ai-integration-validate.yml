name: KoishiPro2 WindBot integration validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ai-integration-validate.yml'
      - 'patches/apply_ios_mods.py'
      - 'patches/finalize_offline_ai.py'
      - 'patches/activate_windbot_ai.py'
      - 'patches/prepare_windbot_runtime.sh'
      - 'patches/sync_main_scripts.sh'
      - 'patches/ai/windbot/**'
      - 'windbot/**'

permissions:
  contents: read

concurrency:
  group: koishipro2-windbot-integration-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15-intel
    timeout-minutes: 50
    env:
      SOURCE_REPO: https://code.moenext.com/hex/ygopro2.git
      SOURCE_COMMIT: c1850e1120df6a5885692eadacad8ad114a3cf11

    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4
        with:
          path: control

      - name: Static patch preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for path in sorted(Path('control/patches').rglob('*.py')):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
              print(f'python syntax ok: {path}')
          PY
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find control/patches control/windbot -type f -name '*.sh' -print | sort)

      - name: Restore fixed KoishiPro2 source snapshot
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: source
          key: koishipro2-source-${{ env.SOURCE_COMMIT }}-v1

      - name: Fetch exact KoishiPro2 source
        shell: bash
        run: |
          set -euo pipefail
          if [ -d source/.git ] && [ "$(git -C source rev-parse HEAD 2>/dev/null || true)" = "$SOURCE_COMMIT" ]; then
            echo "Using cached KoishiPro2 source snapshot."
          else
            rm -rf source
            mkdir source
            git -C source init -q
            git -C source remote add origin "$SOURCE_REPO"
            git -C source config http.version HTTP/1.1
            git -C source fetch --quiet --no-tags --depth=1 origin "$SOURCE_COMMIT"
            git -C source checkout --quiet --detach FETCH_HEAD
          fi
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Apply base iOS modifications
        shell: bash
        run: |
          set -euo pipefail
          python3 control/patches/apply_ios_mods.py source
          bash control/patches/sync_main_scripts.sh source
          python3 control/patches/finalize_offline_ai.py source
          python3 control/patches/activate_windbot_ai.py source
          bash control/patches/prepare_windbot_runtime.sh source

      - name: Build current Koishi ocgcore for iOS
        shell: bash
        run: |
          set -euo pipefail
          chmod +x control/windbot/build_koishi_core_ios.sh
          control/windbot/build_koishi_core_ios.sh source/Assets/Plugins/iOS

      - name: Validate generated WindBot integration
        shell: bash
        run: |
          set -euo pipefail
          PROGRAM='source/Assets/SibylSystem/Program.cs'
          MENU='source/Assets/SibylSystem/Menu/Menu.cs'
          AIROOM='source/Assets/SibylSystem/Room/AIRoom.cs'
          BRIDGE='source/Assets/SibylSystem/KoishiWindBotBridge.cs'
          ROUTER='source/Assets/SibylSystem/WindBotRuntime/LocalRuntime/LocalDuelRouter.cs'
          NATIVE='source/Assets/SibylSystem/WindBotRuntime/LocalRuntime/LocalDuelNative.cs'
          DECKS_MANAGER='source/Assets/SibylSystem/WindBotRuntime/Game/AI/DecksManager.cs'
          EXECUTOR='source/Assets/SibylSystem/WindBotRuntime/Game/AI/Decks/RadiantTyphoonExecutor.cs'
          ALTEXECUTOR='source/Assets/SibylSystem/WindBotRuntime/Game/AI/Decks/BlueEyesExecutor.cs'
          DECK='source/Assets/StreamingAssets/WindBotData/Decks/AI_RadiantTyphoon.ydk'
          ALTDECK='source/Assets/StreamingAssets/WindBotData/Decks/AI_BlueEyes.ydk'
          CATALOG='source/Assets/StreamingAssets/WindBotData/deck-catalog.tsv'
          DIALOG='source/Assets/StreamingAssets/WindBotData/Dialogs/wof-Kasumisawa-Haruma.json'
          CORE='source/Assets/Plugins/iOS/libkoishi_ocgcore.a'
          SCRIPTS='source/Assets/StreamingAssets/koishi-main-script-update.zip'

          for f in "$PROGRAM" "$MENU" "$AIROOM" "$BRIDGE" "$ROUTER" "$NATIVE" "$DECKS_MANAGER" "$EXECUTOR" "$ALTEXECUTOR" "$DECK" "$ALTDECK" "$CATALOG" "$DIALOG" "$CORE" "$SCRIPTS"; do
            test -s "$f"
          done

          grep -q 'KoishiWindBotBridge' "$AIROOM"
          grep -q 'GetDeckNames' "$AIROOM"
          grep -q 'HideControl("life_")' "$AIROOM"
          grep -q 'HideControl("mr4_")' "$AIROOM"
          grep -q 'HideControl("god_")' "$AIROOM"
          grep -q 'const int OptionFontSize = 26' "$AIROOM"
          grep -q 'const int DeckListFontSize = 24' "$AIROOM"
          grep -q 'CreateSideBySideDeckLists' "$AIROOM"
          grep -q 'PlayerDeckList' "$AIROOM"
          grep -q 'AiDeckList' "$AIROOM"
          grep -q 'OnPlayerDeckSelected' "$AIROOM"
          grep -q 'OnAiDeckSelected' "$AIROOM"
          grep -q 'PopulatePlayerDeckList' "$AIROOM"
          grep -q 'PopulateAiDeckList' "$AIROOM"
          grep -q '"自分: " + player' "$AIROOM"
          grep -q '"AI: " + ai' "$AIROOM"
          grep -q 'popup.enabled = false' "$AIROOM"
          grep -q 'シャッフルしない' "$AIROOM"
          grep -q '自分が先攻"' "$AIROOM"
          grep -q '対戦開始' "$AIROOM"
          grep -q '戻る' "$AIROOM"
          ! grep -q 'OFFでじゃんけん' "$AIROOM"
          ! grep -q 'PlayerDeckMode' "$AIROOM"
          ! grep -q 'AiDeckMode' "$AIROOM"
          grep -q 'SetSetupScreenVisible(false)' "$AIROOM"
          grep -q 'WindBot_LocalRps' "$AIROOM"
          grep -q 'GetAiPregameChoices' "$AIROOM"
          grep -q 'StartAI(pendingPlayerDeck, pendingAiDeck' "$AIROOM"
          grep -q 'new RadiantTyphoonLocalDuel' "$BRIDGE"
          grep -q 'GetDeckFile(aiDeckName)' "$BRIDGE"
          grep -q 'GetAiPregameChoices' "$BRIDGE"
          grep -q 'MasterRule = 5' "$BRIDGE"
          grep -q 'class LocalDuelRouter' "$ROUTER"
          grep -q 'ShouldHideFacedownCode' "$ROUTER"
          grep -q 'AOT.MonoPInvokeCallback' "$NATIVE"
          grep -q 'explicit iOS registry' "$DECKS_MANAGER"
          grep -q 'class RadiantTyphoonExecutor' "$EXECUTOR"
          grep -q 'class BlueEyesExecutor' "$ALTEXECUTOR"
          awk -F '\t' '$1=="Blue-Eyes" && $2=="AI_BlueEyes" { found=1 } END { exit(found ? 0 : 1) }' "$CATALOG"
          awk -F '\t' '$1=="RadiantTyphoon" && $2=="AI_RadiantTyphoon" { found=1 } END { exit(found ? 0 : 1) }' "$CATALOG"
          deck_count=$(tail -n +2 "$CATALOG" | wc -l | tr -d ' ')
          echo "registered WindBot decks=$deck_count"
          test "$deck_count" -gt 20

          grep -q 'MainScriptBootstrap.EnsureInstalled();' "$PROGRAM"
          ! grep -q 'AIBootstrap.EnsureInstalled();' "$PROGRAM"
          ! test -e source/Assets/SibylSystem/precy.cs
          ! test -e source/Assets/SibylSystem/coreWrapper.cs
          ! test -e source/Assets/SibylSystem/AIBootstrap.cs
          ! test -e source/Assets/Plugins/iOS/libocgcore.a

          unzip -l "$SCRIPTS" | grep -q 'script/constant.lua'
          unzip -l "$SCRIPTS" | grep -q 'script/utility.lua'
          unzip -l "$SCRIPTS" | grep -q 'script/procedure.lua'
          unzip -l "$SCRIPTS" | grep -q 'script/patches/entry.lua'

          xcrun nm -gU "$CORE" > "$RUNNER_TEMP/koishi-core-symbols.txt"
          for symbol in _create_duel_v2 _start_duel _end_duel _process _get_message _set_responseb _query_field_card _set_registry_value; do
            grep -q "$symbol" "$RUNNER_TEMP/koishi-core-symbols.txt"
          done

          python3 - "$MENU" <<'PY'
          from pathlib import Path
          import sys
          lines = Path(sys.argv[1]).read_text(encoding='utf-8-sig').splitlines()
          active = [line for line in lines if line.strip() == 'UIHelper.registEvent(gameObject, "ai_", onClickAI);']
          if len(active) != 1:
              raise SystemExit(f'Expected exactly one active ai_ event registration; found {len(active)}')
          PY
          echo 'WindBot integration validation passed.'

      - name: Upload validation snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KoishiPro2-WindBot-integration-validation
          path: |
            source/Assets/SibylSystem/Room/AIRoom.cs
            source/Assets/SibylSystem/KoishiWindBotBridge.cs
            source/Assets/SibylSystem/WindBotRuntime/LocalRuntime/LocalDuelRouter.cs
            source/Assets/SibylSystem/WindBotRuntime/LocalRuntime/LocalDuelNative.cs
            source/Assets/SibylSystem/WindBotRuntime/Game/AI/DecksManager.cs
            source/Assets/SibylSystem/WindBotRuntime/Game/AI/Decks/RadiantTyphoonExecutor.cs
            source/Assets/SibylSystem/WindBotRuntime/Game/AI/Decks/BlueEyesExecutor.cs
            source/Assets/StreamingAssets/WindBotData/deck-catalog.tsv
            source/Assets/Plugins/iOS/libkoishi_ocgcore.a
            source/Assets/Plugins/iOS/koishi-runtime-revisions.txt
            source/Assets/StreamingAssets/WindBotData/windbot-revision.txt
            source/Assets/StreamingAssets/WindBotData/Decks/AI_RadiantTyphoon.ydk
            source/Assets/StreamingAssets/WindBotData/Decks/AI_BlueEyes.ydk
            source/Assets/StreamingAssets/koishi-main-scripts-revision.txt
          if-no-files-found: warn
          retention-days: 1
