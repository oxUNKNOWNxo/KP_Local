name: KoishiPro2 source inspection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/source-inspect.yml'

permissions:
  contents: read

concurrency:
  group: koishipro2-source-inspection
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REPO: https://code.moenext.com/hex/ygopro2.git
      SOURCE_COMMIT: c1850e1120df6a5885692eadacad8ad114a3cf11
      WINDBOT_REPO: https://github.com/purerosefallen/windbot.git

    steps:
      - name: Checkout control repository
        uses: actions/checkout@v7
        with:
          path: control

      - name: Restore fixed KoishiPro2 source snapshot
        id: source-cache
        uses: actions/cache/restore@v6
        with:
          path: source
          key: koishipro2-source-${{ env.SOURCE_COMMIT }}-v1

      - name: Ensure fixed source is available
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d source/.git ] || [ "$(git -C source rev-parse HEAD 2>/dev/null || true)" != "$SOURCE_COMMIT" ]; then
            rm -rf source
            mkdir source
            git -C source init -q
            git -C source remote add origin "$SOURCE_REPO"
            git -C source config http.version HTTP/1.1
            git -C source fetch --quiet --no-tags --depth=1 origin "$SOURCE_COMMIT"
            git -C source checkout --quiet --detach FETCH_HEAD
          fi
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Inspect fixed and current upstream script layouts
        shell: bash
        run: |
          set -euo pipefail
          git -C source config http.version HTTP/1.1
          git -C source fetch --quiet --no-tags --depth=1 origin HEAD
          LATEST_COMMIT=$(git -C source rev-parse FETCH_HEAD)
          LATEST_ROOT="$PWD/latest-source"
          echo "latest upstream commit: $LATEST_COMMIT"

          rm -rf "$LATEST_ROOT"
          git -C source worktree add --quiet --detach "$LATEST_ROOT" "$LATEST_COMMIT"
          trap 'git -C source worktree remove --force "$LATEST_ROOT" >/dev/null 2>&1 || true' EXIT

          mkdir -p inspection
          printf '%s\n' "$SOURCE_COMMIT" > inspection/fixed-commit.txt
          printf '%s\n' "$LATEST_COMMIT" > inspection/latest-commit.txt
          if [ "$LATEST_COMMIT" = "$SOURCE_COMMIT" ]; then
            printf 'up-to-date\n' > inspection/source-update-status.txt
          else
            printf 'update-available\n' > inspection/source-update-status.txt
          fi
          git -C source show -s --format='%H%n%cI%n%s' "$SOURCE_COMMIT" > inspection/fixed-commit-info.txt
          git -C source show -s --format='%H%n%cI%n%s' "$LATEST_COMMIT" > inspection/latest-commit-info.txt

          {
            echo '=== fixed loose lua ==='
            find source -type f -name '*.lua' | sed 's#^source/##' | sort | head -400 || true
            echo
            echo '=== latest loose lua ==='
            find "$LATEST_ROOT" -type f -name '*.lua' | sed "s#^$LATEST_ROOT/##" | sort | head -800 || true
            echo
            echo '=== latest likely script directories ==='
            find "$LATEST_ROOT" -maxdepth 8 -type d \( -iname 'script' -o -iname 'scripts' -o -iname '*script*' \) | sort | head -500 || true
            echo
            echo '=== latest archives ==='
            find "$LATEST_ROOT/Assets" -type f \( -name '*.zip' -o -name '*.7z' -o -name '*.tar*' \) | sort || true
            echo
            echo '=== latest WindBot/bot references ==='
            grep -RniE --include='*.cs' --include='*.json' --include='*.txt' 'WindBot|bots\.json|RadiantTyphoon|GameAI|Executor' "$LATEST_ROOT/Assets" 2>/dev/null | head -1000 || true
          } | tee inspection/layout.txt

          export LATEST_ROOT
          python3 - <<'PY' | tee inspection/archive-layout.txt
          from pathlib import Path
          import os
          import zipfile

          roots = [
              ('fixed', Path('source')),
              ('latest', Path(os.environ['LATEST_ROOT'])),
          ]
          for root_label, root in roots:
              print(f'=== {root_label} zip inspection ===')
              zips = sorted(root.joinpath('Assets').rglob('*.zip'))
              for path in zips:
                  try:
                      with zipfile.ZipFile(path) as z:
                          names = [n.replace('\\\\', '/') for n in z.namelist()]
                          lua = [n for n in names if n.lower().endswith('.lua')]
                          interesting = [
                              n for n in names
                              if n.lower().endswith('.lua')
                              or 'constant.lua' in n.lower()
                              or 'utility.lua' in n.lower()
                              or '/script' in n.lower()
                              or n.lower().startswith('script')
                              or 'windbot' in n.lower()
                              or 'bot' in n.lower()
                          ]
                          if lua or path.name == 'ygopro2-data.zip' or interesting:
                              print(path)
                              print(' entries=', len(names), ' lua=', len(lua))
                              for n in interesting[:1000]:
                                  print(' ', n)
                  except zipfile.BadZipFile:
                      pass
          PY

      - name: Inspect current WindBot upstream and empty decks
        shell: bash
        run: |
          set -euo pipefail
          WINDBOT_ROOT="$PWD/latest-windbot"
          rm -rf "$WINDBOT_ROOT"
          git init -q "$WINDBOT_ROOT"
          git -C "$WINDBOT_ROOT" remote add origin "$WINDBOT_REPO"
          git -C "$WINDBOT_ROOT" config http.version HTTP/1.1
          git -C "$WINDBOT_ROOT" fetch --quiet --no-tags --depth=1 origin master
          git -C "$WINDBOT_ROOT" checkout --quiet --detach FETCH_HEAD

          WINDBOT_COMMIT=$(git -C "$WINDBOT_ROOT" rev-parse HEAD)
          echo "latest WindBot commit: $WINDBOT_COMMIT"
          printf '%s\n' "$WINDBOT_COMMIT" > inspection/windbot-latest-commit.txt
          git -C "$WINDBOT_ROOT" show -s --format='%H%n%cI%n%s' HEAD > inspection/windbot-latest-commit-info.txt

          python3 - "$WINDBOT_ROOT" <<'PY' | tee inspection/windbot-empty-decks.txt
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          decks = root / 'Decks'
          executors = root / 'Game' / 'AI' / 'Decks'

          empty = []
          nonempty = []
          for path in sorted(decks.glob('*.ydk')):
              count = 0
              section = None
              for raw in path.read_text(encoding='utf-8-sig', errors='replace').splitlines():
                  line = raw.strip()
                  if not line:
                      continue
                  if line.startswith('#') or line.startswith('!'):
                      section = line
                      continue
                  if line.isdigit():
                      count += 1
              (empty if count == 0 else nonempty).append((path.stem, count))

          deck_attr = re.compile(r'\[Deck\(\s*"([^"]+)"(?:\s*,\s*"([^"]*)")?')
          registered = []
          for path in sorted(executors.glob('*.cs')):
              text = path.read_text(encoding='utf-8-sig', errors='replace')
              for m in deck_attr.finditer(text):
                  name = m.group(1)
                  deck_file = m.group(2) or name
                  registered.append((name, deck_file, path.name))

          print(f'ydk_total={len(empty)+len(nonempty)}')
          print(f'empty_ydk_count={len(empty)}')
          for name, count in empty:
              refs = [x for x in registered if x[1] == name]
              print(f'EMPTY\t{name}\tcards={count}\tregistered={bool(refs)}\trefs={refs}')

          missing_files = []
          for name, deck_file, source in registered:
              if not (decks / f'{deck_file}.ydk').is_file():
                  missing_files.append((name, deck_file, source))
          print(f'registered_executor_count={len(registered)}')
          print(f'executor_missing_ydk_count={len(missing_files)}')
          for row in missing_files:
              print('MISSING_YDK\t' + '\t'.join(row))
          PY

      - name: Inspect script download and extraction paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== script/lua/update references ==='
            grep -RniE -C 8 --include='*.cs' 'script[/\\]|\.lua|lua|StreamingAssets|ExtractZip|DownloadAndProcessFile|UnityWebRequest|http[s]?://|Resource Update|资源|更新' source/Assets/SibylSystem source/Assets/YGOSharp 2>/dev/null | head -5000 || true
          } | tee inspection/script-update-paths.txt

      - name: Upload inspection snapshot
        uses: actions/upload-artifact@v7
        with:
          name: KoishiPro2-source-inspection
          path: inspection
          if-no-files-found: error
          retention-days: 1
