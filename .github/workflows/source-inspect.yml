name: KoishiPro2 source inspection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/source-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor == github.repository_owner && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REPO: https://code.moenext.com/hex/ygopro2.git
      SOURCE_COMMIT: c1850e1120df6a5885692eadacad8ad114a3cf11
    steps:
      - name: Fetch exact KoishiPro2 source revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          git -C source init -q
          git -C source remote add origin "$SOURCE_REPO"
          git -C source config http.version HTTP/1.1
          fetched=0
          for attempt in 1 2 3 4 5; do
            echo "Fetch attempt $attempt/5"
            if git -C source fetch --quiet --no-tags --depth=1 origin "$SOURCE_COMMIT"; then
              fetched=1
              break
            fi
            sleep 5
          done
          test "$fetched" -eq 1
          git -C source checkout --quiet --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Build source inspection package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection/files

          {
            echo '=== CDB / DB / download / sync candidates ==='
            grep -RniE --include='*.cs' --include='*.mm' --include='*.m' --include='*.h' --include='*.cpp' --include='*.json' --include='*.conf' \
              'cards\.cdb|\.cdb|database|card.?data|download|sync|update|WWW|UnityWebRequest|HttpClient' source/Assets 2>/dev/null || true
            echo
            echo '=== Safe area / resolution / notch / iOS candidates ==='
            grep -RniE --include='*.cs' --include='*.mm' --include='*.m' --include='*.h' --include='*.cpp' \
              'safe.?area|Screen\.safeArea|resolution|SetResolution|notch|iPhone|iOS|Screen\.width|Screen\.height|Display' source/Assets 2>/dev/null || true
          } > inspection/search-report.txt

          cd source
          while IFS= read -r -d '' f; do
            mkdir -p "../inspection/files/$(dirname "$f")"
            cp "$f" "../inspection/files/$f"
          done < <(find Assets ProjectSettings -type f \( \
            -name '*.cs' -o -name '*.mm' -o -name '*.m' -o -name '*.h' -o -name '*.cpp' \
            -o -name '*.plist' -o -name '*.json' -o -name '*.conf' -o -name '*.txt' \
          \) -print0)
          cd ..

          printf '%s\n' "$SOURCE_COMMIT" > inspection/SOURCE_COMMIT.txt
          zip -qry KoishiPro2-source-inspection.zip inspection
          ls -lh KoishiPro2-source-inspection.zip inspection/search-report.txt

      - name: Upload source inspection package
        uses: actions/upload-artifact@v4
        with:
          name: KoishiPro2-source-inspection
          path: KoishiPro2-source-inspection.zip
          if-no-files-found: error
          retention-days: 1
