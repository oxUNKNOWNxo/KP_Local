name: KoishiPro2 source inspection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/source-inspect.yml'

permissions:
  contents: read

concurrency:
  group: koishipro2-source-inspection
  cancel-in-progress: true

jobs:
  inspect:
    if: github.actor == github.repository_owner && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_REPO: https://code.moenext.com/hex/ygopro2.git
      SOURCE_COMMIT: c1850e1120df6a5885692eadacad8ad114a3cf11

    steps:
      - name: Restore fixed KoishiPro2 source snapshot
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: source
          key: koishipro2-source-${{ env.SOURCE_COMMIT }}-v1

      - name: Verify fixed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.source-cache.outputs.cache-hit }}' = 'true'
          test -d source/.git
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Inspect CDB sync and menu transition paths
        shell: bash
        run: |
          set -euo pipefail
          PROGRAM='source/Assets/SibylSystem/Program.cs'
          MENU='source/Assets/SibylSystem/Menu/Menu.cs'
          test -s "$PROGRAM"
          test -s "$MENU"

          echo '=== Program: basic-data/CDB/update references ==='
          grep -nE -C 22 'cards\.cdb|BasicData|RetryBasicDataUpdate|UpdateClientCoroutine|ReloadGameDatabases|DownloadAndProcessFile|正在|progress|download|update' "$PROGRAM" || true

          echo '=== Menu: transition/click references ==='
          grep -nE -C 18 'shiftToServant|onClickAI|onClickPizzle|onClickDeck|onClickReplay|StartCoroutine|WaitForSeconds|WWW|UnityWebRequest' "$MENU" || true

          echo '=== Program shiftToServant implementation ==='
          grep -n -A 180 -B 25 'void shiftToServant' "$PROGRAM" || true

          echo '=== Program per-frame resize/update implementation ==='
          sed -n '2145,2420p' "$PROGRAM"

          echo '=== Menu show/status/update-check implementation ==='
          sed -n '130,270p' "$MENU"

          echo '=== Servant/window show-hide implementations ==='
          for FILE in source/Assets/SibylSystem/Servant.cs source/Assets/SibylSystem/WindowServant.cs source/Assets/SibylSystem/WindowServantSP.cs; do
            if [ -f "$FILE" ]; then
              echo "--- $FILE ---"
              grep -nE -A 140 -B 30 'public virtual void show|public override void show|void show\(|public virtual void hide|public override void hide|void hide\(|applyShowArrangement|applyHideArrangement' "$FILE" || true
            fi
          done

          echo '=== Delayed-task scheduler implementation ==='
          grep -RniE -A 120 -B 30 --include='*.cs' 'static void go\(|void go\(|class delayedTask|TimePassed\(|notGo\(' source/Assets/SibylSystem/Program.cs source/Assets/SibylSystem 2>/dev/null | head -1800 || true

          echo '=== Main menu target screen show methods ==='
          grep -RniE -A 120 -B 20 --include='*.cs' 'class (Setting|selectDeck|selectReplay|SelectServer|MyCard|AIRoom)|public override void show\(' source/Assets/SibylSystem 2>/dev/null | head -2600 || true

          echo '=== Main menu click handlers ==='
          sed -n '675,790p' "$MENU"

          echo '=== Project-wide Chinese progress/update references ==='
          grep -RniE -C 4 --include='*.cs' '正在|更新中|下载|0%|progress|DownloadAndProcessFile|UpdateClientCoroutine' source/Assets/SibylSystem 2>/dev/null | head -1200 || true

          mkdir -p inspection
          cp "$PROGRAM" inspection/Program.cs
          cp "$MENU" inspection/Menu.cs
          grep -RniE --include='*.cs' '正在|更新中|下载|0%|progress|DownloadAndProcessFile|UpdateClientCoroutine' source/Assets/SibylSystem 2>/dev/null > inspection/update-search.txt || true
          printf '%s\n' "$SOURCE_COMMIT" > inspection/SOURCE_COMMIT.txt

      - name: Upload inspection snapshot
        uses: actions/upload-artifact@v4
        with:
          name: KoishiPro2-source-inspection
          path: inspection
          if-no-files-found: error
          retention-days: 1
