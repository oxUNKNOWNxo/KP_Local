name: KoishiPro2 source inspection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/source-inspect.yml'

permissions:
  contents: read

concurrency:
  group: koishipro2-source-inspection-cache-arm
  cancel-in-progress: true

jobs:
  inspect:
    if: github.actor == github.repository_owner && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: macos-15
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: c1850e1120df6a5885692eadacad8ad114a3cf11
    steps:
      - name: Restore successful Unity Library cache
        id: library-cache
        uses: actions/cache/restore@v4
        with:
          path: source/Library
          key: koishipro2-library-macOS-X64-2021.3.45f1-ios-c1850e1120df6a5885692eadacad8ad114a3cf11-v3

      - name: Locate compiled game assembly
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.library-cache.outputs.cache-hit }}' = 'true'
          DLL='source/Library/ScriptAssemblies/Assembly-CSharp.dll'
          test -f "$DLL"
          ls -lh "$DLL"
          file "$DLL"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Decompile Assembly-CSharp
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global ilspycmd
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p inspection/decompiled
          ilspycmd -p -o inspection/decompiled source/Library/ScriptAssemblies/Assembly-CSharp.dll
          cp source/Library/ScriptAssemblies/Assembly-CSharp.dll inspection/Assembly-CSharp.dll

          {
            echo '=== CDB / DB / basic-data sync candidates ==='
            grep -RniE --include='*.cs' 'cards\.cdb|BasicData|RetryBasicDataUpdate|UpdateClientCoroutine|ReloadGameDatabases|DownloadAndProcessFile|database|\.cdb|online.?sync|正在|0%' inspection/decompiled 2>/dev/null || true
            echo
            echo '=== Menu transition / click latency candidates ==='
            grep -RniE --include='*.cs' 'shiftToServant|onClickAI|onClickPizzle|onClickDeck|onClickReplay|onClick|WaitForSeconds|StartCoroutine|WWW|UnityWebRequest' inspection/decompiled/SibylSystem 2>/dev/null || true
            echo
            echo '=== Safe area / notch / screen candidates ==='
            grep -RniE --include='*.cs' 'Screen\.safeArea|safeArea|cutouts|notch|GetLeftScreenOffset|fixScreenProblems|fixALLcameras|SetResolution|Screen\.width|Screen\.height' inspection/decompiled 2>/dev/null || true
          } > inspection/search-report.txt

          PROGRAM=$(find inspection/decompiled -path '*/SibylSystem/Program.cs' -print -quit)
          MENU=$(find inspection/decompiled -path '*/SibylSystem/Menu/Menu.cs' -print -quit)
          test -n "$PROGRAM"
          test -n "$MENU"
          cp "$PROGRAM" inspection/Program.cs
          cp "$MENU" inspection/Menu.cs
          echo '--- Program sync excerpts ---'
          grep -nE -C 18 'BasicData|RetryBasicDataUpdate|UpdateClientCoroutine|cards\.cdb|正在|progress' inspection/Program.cs || true
          echo '--- Menu transition excerpts ---'
          grep -nE -C 14 'shiftToServant|onClickAI|onClickPizzle|onClickDeck|onClickReplay' inspection/Menu.cs || true

          printf '%s\n' "$SOURCE_COMMIT" > inspection/SOURCE_COMMIT.txt
          zip -qry KoishiPro2-source-inspection.zip inspection
          ls -lh KoishiPro2-source-inspection.zip inspection/search-report.txt

      - name: Upload source inspection package
        uses: actions/upload-artifact@v4
        with:
          name: KoishiPro2-source-inspection
          path: KoishiPro2-source-inspection.zip
          if-no-files-found: error
          retention-days: 1
