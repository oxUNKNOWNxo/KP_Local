name: KoishiPro2 iOS cloud build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios-cloud-build.yml'
      - 'patches/**'
      - 'windbot/**'

permissions:
  contents: read

concurrency:
  group: koishipro2-ios-build
  cancel-in-progress: true

jobs:
  build:
    if: github.actor == github.repository_owner && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: macos-15-intel
    timeout-minutes: 210

    env:
      UNITY_VERSION: 2021.3.45f1
      UNITY_CHANGESET: 0da89fac8e79
      SOURCE_REPO: https://code.moenext.com/hex/ygopro2.git
      SOURCE_COMMIT: c1850e1120df6a5885692eadacad8ad114a3cf11
      AI_CORE_COMMIT: c00c90cff77f5e3c65d217597481a065404ed94b
      UNITY_CLI_HOME: /tmp/unity-cli
      UNITY_CACHE_SCHEMA: v4

    steps:
      - name: Checkout build control files
        uses: actions/checkout@v4
        with:
          path: control

      - name: Static patch preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for path in sorted(Path('control/patches').rglob('*.py')):
              source = path.read_text(encoding='utf-8')
              compile(source, str(path), 'exec')
              print(f'python syntax ok: {path}')
          PY

          while IFS= read -r script; do
            bash -n "$script"
          done < <(find control/patches control/windbot -type f -name '*.sh' -print | sort)

          python3 - <<'PY'
          from pathlib import Path

          finalizer = Path('control/patches/finalize_offline_ai.py').read_text(encoding='utf-8')
          packer = Path('control/patches/prepare_ai_pack.sh').read_text(encoding='utf-8')
          notch = Path('control/patches/prepare_notch_compat.py').read_text(encoding='utf-8')

          required_finalizer = (
              'private void EnableAiMenuEntry()',
              'aiEntry.parent.name == "ai"',
              'System.Collections.Generic.List<Transform> columnItems',
              'Mathf.Abs(siblingPosition.x - p.x) > 12f',
              'bool foundExistingBounds = false;',
              'columnItems.Insert(0, movable);',
              'float rowSpacing = (topY - bottomY) / (columnItems.Count - 1);',
          )
          missing = [item for item in required_finalizer if item not in finalizer]
          if missing:
              raise SystemExit(f'AI finalizer preflight failed; missing {missing}')
          if 'clone.name' in finalizer or 'clone.name' in packer:
              raise SystemExit('Obsolete cloned AI menu logic remains in reviewed patches')
          viewport = Path('control/patches/ios/IPhone16x9Viewport.cs').read_text(encoding='utf-8')
          if 'Koishi16x9ContainerView' not in notch:
              raise SystemExit('Notch/aspect patch is missing the native 16:9 container')
          if 'scheduleUnitySurfaceRefresh' in notch or '[content layoutIfNeeded];' in notch:
              raise SystemExit('Obsolete native UnityView surface refresh logic remains')
          if 'Screen.SetResolution' in viewport:
              raise SystemExit('Runtime Screen.SetResolution must not be used on iOS')
          if 'Legacy 16:9 iPhone compatibility framing enabled.' not in viewport:
              raise SystemExit('Managed compatibility marker is missing')
          if 'plist["UILaunchScreen"]' in notch:
              raise SystemExit('Modern UILaunchScreen opt-in must remain disabled')

          print('Static patch preflight passed.')
          PY

      - name: Show runner environment
        shell: bash
        run: |
          set -euo pipefail
          echo "runner arch: $(uname -m)"
          sw_vers
          system_profiler SPDisplaysDataType 2>/dev/null | sed -n '1,80p' || true

      - name: Restore fixed KoishiPro2 source snapshot
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: source
          key: koishipro2-source-${{ env.SOURCE_COMMIT }}-v1

      - name: Fetch exact KoishiPro2 source revision
        shell: bash
        run: |
          set -euo pipefail
          if [ -d source/.git ] && [ "$(git -C source rev-parse HEAD 2>/dev/null || true)" = "$SOURCE_COMMIT" ]; then
            echo "Using cached KoishiPro2 source snapshot."
          else
            rm -rf source
            mkdir source
            git -C source init -q
            git -C source remote add origin "$SOURCE_REPO"
            git -C source config http.version HTTP/1.1
            git -C source config protocol.version 2

            fetched=0
            for attempt in 1 2 3 4 5; do
              echo "Fetch attempt $attempt/5"
              if git -C source fetch --quiet --no-tags --depth=1 origin "$SOURCE_COMMIT"; then
                fetched=1
                break
              fi
              if [ "$attempt" -lt 5 ]; then
                sleep 5
              fi
            done

            test "$fetched" -eq 1
            git -C source checkout --quiet --detach FETCH_HEAD
          fi

          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          echo "Source revision verified: $SOURCE_COMMIT"
          cat source/ProjectSettings/ProjectVersion.txt

      - name: Save fixed KoishiPro2 source snapshot
        if: steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: source
          key: koishipro2-source-${{ env.SOURCE_COMMIT }}-v1

      - name: Compute patch fingerprint
        id: patch-fingerprint
        shell: bash
        run: |
          set -euo pipefail
          (
            cd control
            git ls-files -z patches windbot | sort -z | xargs -0 shasum -a 256
          ) > "$RUNNER_TEMP/patch-files.sha256"
          PATCH_HASH=$(shasum -a 256 "$RUNNER_TEMP/patch-files.sha256" | awk '{print $1}')
          test -n "$PATCH_HASH"
          echo "hash=$PATCH_HASH" >> "$GITHUB_OUTPUT"
          echo "Patch fingerprint: $PATCH_HASH"

      - name: Restore prebuilt iOS AI core
        id: ai-core-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/koishipro2-ai-core
          key: koishipro2-ai-core-${{ runner.os }}-${{ runner.arch }}-${{ env.AI_CORE_COMMIT }}-v1

      - name: Apply KoishiPro2 iOS modifications
        shell: bash
        run: |
          set -euo pipefail
          python3 control/patches/apply_ios_mods.py source

      - name: Save prebuilt iOS AI core
        if: steps.ai-core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/koishipro2-ai-core
          key: koishipro2-ai-core-${{ runner.os }}-${{ runner.arch }}-${{ env.AI_CORE_COMMIT }}-v1

      - name: Verify forced DB sync removal
        shell: bash
        run: |
          set -euo pipefail
          PROGRAM="source/Assets/SibylSystem/Program.cs"
          test -f "$PROGRAM"
          echo "Program source: $PROGRAM"
          grep -q 'UseBundledBasicData();' "$PROGRAM"
          if grep -Eq '^[[:space:]]*RetryBasicDataUpdate\(\);[[:space:]]*$' "$PROGRAM"; then
            echo 'Forced startup RetryBasicDataUpdate call is still present.'
            exit 1
          fi
          grep -q 'https://cdntx2.moecube.com/koishipro/content/cards.cdb' "$PROGRAM"
          echo 'Forced DB sync removal validation passed; manual Resource Update remains available.'

      - name: Verify patched managed sources before Unity
        shell: bash
        run: |
          set -euo pipefail
          MENU='source/Assets/SibylSystem/Menu/Menu.cs'
          VIEWPORT='source/Assets/SibylSystem/IPhone16x9Viewport.cs'
          AIROOM='source/Assets/SibylSystem/Room/AIRoom.cs'
          test -s "$MENU"
          test -s "$VIEWPORT"
          test -s "$AIROOM"
          grep -q 'ai_' "$MENU"
          grep -Eq 'SetActive\(true\)|activeSelf|activeInHierarchy' "$MENU"
          grep -q 'EnableAiMenuEntry();' "$MENU"
          grep -q 'System.Collections.Generic.List<Transform> columnItems' "$MENU"
          grep -q 'Mathf.Abs(siblingPosition.x - p.x) > 12f' "$MENU"
          grep -q 'bool foundExistingBounds = false;' "$MENU"
          grep -q 'columnItems.Insert(0, movable);' "$MENU"
          grep -q 'float rowSpacing = (topY - bottomY) / (columnItems.Count - 1);' "$MENU"
          python3 - "$MENU" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding='utf-8-sig').splitlines()
          active = [
              line for line in lines
              if line.strip() == 'UIHelper.registEvent(gameObject, "ai_", onClickAI);'
          ]
          if len(active) != 1:
              raise SystemExit(f'Expected exactly one active ai_ event registration; found {len(active)}')
          PY
          ! grep -q 'clone.name' "$MENU"
          grep -q 'IPhone16x9Viewport' "$VIEWPORT"
          grep -q 'Legacy 16:9 iPhone compatibility framing enabled' "$VIEWPORT"
          if grep -q 'Screen.SetResolution' "$VIEWPORT"; then
            echo 'Runtime Screen.SetResolution remains in the managed viewport helper.'
            exit 1
          fi
          grep -q 'KoishiWindBotBridge' "$AIROOM"
          ! grep -q 'PrecyOcg' "$AIROOM"
          test -s 'source/Assets/SibylSystem/KoishiWindBotBridge.cs'
          test -s 'source/Assets/SibylSystem/WindBotRuntime/LocalRuntime/LocalDuelRouter.cs'
          test -s 'source/Assets/SibylSystem/WindBotRuntime/Game/AI/Decks/RadiantTyphoonExecutor.cs'
          ! grep -q 'AIBootstrap.EnsureInstalled' 'source/Assets/SibylSystem/Program.cs'
          echo 'Patched WindBot managed source validation passed.'

      - name: Verify offline WindBot payload
        shell: bash
        run: |
          set -euo pipefail
          DECK='source/Assets/StreamingAssets/WindBotData/Decks/AI_RadiantTyphoon.ydk'
          DIALOG='source/Assets/StreamingAssets/WindBotData/Dialogs/wof-Kasumisawa-Haruma.json'
          CORE='source/Assets/Plugins/iOS/libkoishi_ocgcore.a'
          SCRIPTS='source/Assets/StreamingAssets/koishi-main-script-update.zip'
          test -s "$DECK"
          test -s "$DIALOG"
          test -s "$CORE"
          test -s "$SCRIPTS"
          unzip -l "$SCRIPTS" | grep -q 'script/constant.lua'
          unzip -l "$SCRIPTS" | grep -q 'script/utility.lua'
          unzip -l "$SCRIPTS" | grep -q 'script/patches/entry.lua'
          xcrun nm -gU "$CORE" > "$RUNNER_TEMP/ios-windbot-core-symbols.txt"
          for symbol in _create_duel_v2 _end_duel _process _get_message _preload_script _query_field_card _set_registry_value _start_duel; do
            grep -q "$symbol" "$RUNNER_TEMP/ios-windbot-core-symbols.txt"
          done
          file "$CORE"
          ls -lh "$DECK" "$CORE" "$SCRIPTS"
          echo 'Offline WindBot payload validation passed before Unity build.'

      - name: Install Unity CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://unity.com/install.sh | UNITY_CLI_CHANNEL=beta UNITY_CLI_HOME="$UNITY_CLI_HOME" bash >/dev/null
          test -x "$UNITY_CLI_HOME/bin/unity"

      - name: Sign in to Unity account
        shell: bash
        run: |
          set -euo pipefail
          UNITY="$UNITY_CLI_HOME/bin/unity"
          echo 'Open the one-time Unity Sign-in URL printed below and complete sign-in.'
          echo 'Do not share account credentials in the Actions log.'
          "$UNITY" auth login --no-color

      - name: Activate Unity Personal
        shell: bash
        run: |
          set -euo pipefail
          UNITY="$UNITY_CLI_HOME/bin/unity"
          "$UNITY" license activate --personal --accept-eula --format json >/dev/null
          echo 'Unity Personal activation completed.'

      - name: Install Unity Editor and iOS Build Support
        shell: bash
        run: |
          set -euo pipefail
          UNITY="$UNITY_CLI_HOME/bin/unity"
          "$UNITY" install "$UNITY_VERSION" \
            --changeset "$UNITY_CHANGESET" \
            --module ios \
            --architecture x86_64 \
            --no-color >/dev/null
          echo "Unity $UNITY_VERSION x86_64 with iOS support installed."

      - name: Restore Unity Library cache
        id: library-cache
        uses: actions/cache/restore@v4
        with:
          path: source/Library
          key: koishipro2-library-${{ runner.os }}-${{ runner.arch }}-${{ env.UNITY_VERSION }}-ios-${{ env.SOURCE_COMMIT }}-${{ steps.patch-fingerprint.outputs.hash }}-${{ env.UNITY_CACHE_SCHEMA }}
          restore-keys: |
            koishipro2-library-${{ runner.os }}-${{ runner.arch }}-${{ env.UNITY_VERSION }}-ios-${{ env.SOURCE_COMMIT }}-

      - name: Report Unity cache decision
        shell: bash
        run: |
          set -euo pipefail
          echo "cache-hit=${{ steps.library-cache.outputs.cache-hit }}"
          echo "cache-key=koishipro2-library-${{ runner.os }}-${{ runner.arch }}-${{ env.UNITY_VERSION }}-ios-${{ env.SOURCE_COMMIT }}-${{ steps.patch-fingerprint.outputs.hash }}-${{ env.UNITY_CACHE_SCHEMA }}"

      - name: Locate Unity Editor
        id: editor
        shell: bash
        run: |
          set -euo pipefail
          EDITOR="/Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"
          if [ ! -x "$EDITOR" ]; then
            EDITOR=$(find /Applications "$HOME" -type f -path "*/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity" -print -quit 2>/dev/null || true)
          fi
          test -n "$EDITOR"
          test -x "$EDITOR"
          file "$EDITOR"
          echo "path=$EDITOR" >> "$GITHUB_OUTPUT"
          echo 'Unity Editor located.'

      - name: Import and compile Unity project for iOS
        id: unity-import
        timeout-minutes: 75
        shell: bash
        run: |
          set -euo pipefail
          EDITOR='${{ steps.editor.outputs.path }}'
          LOG="$RUNNER_TEMP/unity-import.log"

          safe_tail() {
            tail -80 "$LOG" 2>/dev/null | sed -E '/[Ll]icen[sc]e|serial|machine.?id|access.?token|refresh.?token|oauth|services\.api\.unity\.com\/app-linking|Sign-in URL/d' || true
          }

          "$EDITOR" \
            -batchmode \
            -nographics \
            -silent-crashes \
            -accept-apiupdate \
            -buildTarget iOS \
            -projectPath "$GITHUB_WORKSPACE/source" \
            -logFile "$LOG" \
            -quit &
          UNITY_PID=$!

          (
            while kill -0 "$UNITY_PID" 2>/dev/null; do
              sleep 300
              if kill -0 "$UNITY_PID" 2>/dev/null; then
                echo '--- Unity iOS import progress (redacted tail) ---'
                safe_tail
              fi
            done
          ) &
          MONITOR_PID=$!

          set +e
          wait "$UNITY_PID"
          STATUS=$?
          set -e
          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true

          if [ "$STATUS" -ne 0 ]; then
            echo "Unity iOS import failed with exit code $STATUS."
            safe_tail
            exit "$STATUS"
          fi

          echo 'Unity iOS-target import completed.'

      - name: Save Unity Library cache
        if: steps.unity-import.outcome == 'success' && steps.library-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: source/Library
          key: koishipro2-library-${{ runner.os }}-${{ runner.arch }}-${{ env.UNITY_VERSION }}-ios-${{ env.SOURCE_COMMIT }}-${{ steps.patch-fingerprint.outputs.hash }}-${{ env.UNITY_CACHE_SCHEMA }}

      - name: Export Unity iOS Xcode project
        timeout-minutes: 75
        shell: bash
        run: |
          set -euo pipefail
          EDITOR='${{ steps.editor.outputs.path }}'
          LOG="$RUNNER_TEMP/unity-build.log"
          STALL_FLAG="$RUNNER_TEMP/unity-export-stalled"
          rm -f "$STALL_FLAG"

          safe_tail() {
            tail -120 "$LOG" 2>/dev/null | sed -E '/[Ll]icen[sc]e|serial|machine.?id|access.?token|refresh.?token|oauth|services\.api\.unity\.com\/app-linking|Sign-in URL/d' || true
          }

          show_processes() {
            echo '--- Unity-related processes ---'
            ps -axo pid,ppid,%cpu,%mem,etime,command | grep -E 'Unity|JobProcess|ShaderCompiler|il2cpp|bee_backend' | grep -v grep | head -80 || true
            echo '--- output size ---'
            du -sh "$GITHUB_WORKSPACE/source/output" 2>/dev/null || true
          }

          "$EDITOR" \
            -batchmode \
            -silent-crashes \
            -accept-apiupdate \
            -buildTarget iOS \
            -projectPath "$GITHUB_WORKSPACE/source" \
            -logFile "$LOG" \
            -executeMethod BuildHelper.Build \
            -quit &
          UNITY_PID=$!

          (
            last_size=-1
            unchanged=0
            tick=0
            while kill -0 "$UNITY_PID" 2>/dev/null; do
              sleep 60
              kill -0 "$UNITY_PID" 2>/dev/null || break
              size=$(wc -c < "$LOG" 2>/dev/null || echo 0)
              if [ "$size" = "$last_size" ]; then
                unchanged=$((unchanged + 1))
              else
                unchanged=0
                last_size="$size"
              fi
              tick=$((tick + 1))

              if [ $((tick % 5)) -eq 0 ]; then
                echo "--- Unity iOS export progress: ${tick}m (redacted tail) ---"
                safe_tail
                show_processes
              fi

              if [ "$unchanged" -ge 10 ]; then
                if tail -160 "$LOG" 2>/dev/null | grep -Eq 'Builtin Sky manager started|Starting cubemap convolution|GfxDevice renderer is null'; then
                  echo 'Detected a 10-minute Unity log stall around SkyManager/cubemap processing.'
                  safe_tail
                  show_processes
                  touch "$STALL_FLAG"
                  kill -TERM "$UNITY_PID" 2>/dev/null || true
                  sleep 10
                  kill -KILL "$UNITY_PID" 2>/dev/null || true
                  break
                fi
              fi
            done
          ) &
          MONITOR_PID=$!

          set +e
          wait "$UNITY_PID"
          STATUS=$?
          set -e
          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true

          if [ -f "$STALL_FLAG" ]; then
            echo 'Unity export was terminated after a confirmed SkyManager/cubemap log stall.'
            exit 124
          fi

          if [ "$STATUS" -ne 0 ]; then
            echo "Unity iOS export failed with exit code $STATUS."
            safe_tail
            show_processes
            exit "$STATUS"
          fi

          test -d "$GITHUB_WORKSPACE/source/output/Unity-iPhone.xcodeproj"
          echo 'Unity iOS export completed.'

      - name: Verify patched code reached IL2CPP output
        shell: bash
        run: |
          set -euo pipefail
          NATIVE_DIR='source/output/Classes/Native'
          test -d "$NATIVE_DIR"
          grep -R -l --include='*.cpp' --include='*.h' 'IPhone16x9Viewport' "$NATIVE_DIR" > "$RUNNER_TEMP/viewport-il2cpp.txt" || true
          grep -R -l --include='*.cpp' --include='*.h' -E 'KoishiWindBotBridge|LocalDuelRouter|RadiantTyphoonExecutor' "$NATIVE_DIR" > "$RUNNER_TEMP/windbot-il2cpp.txt" || true
          grep -R -l --include='*.cpp' --include='*.h' -E 'onClickAI|ai_' "$NATIVE_DIR" > "$RUNNER_TEMP/ai-menu-il2cpp.txt" || true
          test -s "$RUNNER_TEMP/viewport-il2cpp.txt" || { echo 'IPhone16x9Viewport did not reach IL2CPP output.'; exit 1; }
          test -s "$RUNNER_TEMP/windbot-il2cpp.txt" || { echo 'WindBot runtime did not reach IL2CPP output.'; exit 1; }
          test -s "$RUNNER_TEMP/ai-menu-il2cpp.txt" || { echo 'AI menu handler did not reach IL2CPP output.'; exit 1; }
          echo '--- viewport IL2CPP files ---'
          cat "$RUNNER_TEMP/viewport-il2cpp.txt"
          echo '--- WindBot IL2CPP files ---'
          cat "$RUNNER_TEMP/windbot-il2cpp.txt"
          echo '--- AI menu IL2CPP files ---'
          cat "$RUNNER_TEMP/ai-menu-il2cpp.txt"
          echo 'Verified patched runtime code in IL2CPP output.'

      - name: Prepare generated Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd source/output
          sed -i '' 's/ENABLE_BITCODE = YES;/ENABLE_BITCODE = NO;/g' Unity-iPhone.xcodeproj/project.pbxproj || true
          /usr/libexec/PlistBuddy -c 'Add :UIFileSharingEnabled bool true' Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Set :UIFileSharingEnabled true' Info.plist
          /usr/libexec/PlistBuddy -c 'Add :LSSupportsOpeningDocumentsInPlace bool true' Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Set :LSSupportsOpeningDocumentsInPlace true' Info.plist
          cd "$GITHUB_WORKSPACE"
          python3 control/patches/prepare_notch_compat.py source/output
          VIEW_FILE=$(find source/output -name 'UnityAppController+ViewHandling.mm' -print -quit)
          test -n "$VIEW_FILE"
          python3 - "$VIEW_FILE" <<'PY'
          from pathlib import Path
          import sys

          text = Path(sys.argv[1]).read_text(encoding='utf-8')
          if 'Koishi16x9ContainerView' not in text:
              raise SystemExit('Generated native 16:9 container is missing')
          if 'scheduleUnitySurfaceRefresh' in text or '[content layoutIfNeeded];' in text:
              raise SystemExit('Obsolete native UnityView surface refresh logic reached Xcode output')
          if '[koishiContainer layoutIfNeeded];' in text:
              raise SystemExit('Synchronous container layout must not run during startup')
          PY
          for key in UILaunchStoryboardName UILaunchScreens UILaunchScreen UILaunchStoryboards; do
            if /usr/libexec/PlistBuddy -c "Print :$key" source/output/Info.plist >/dev/null 2>&1; then
              echo "Unexpected modern launch declaration remains: $key"
              exit 1
            fi
          done
          echo 'Legacy launch-image compatibility mode verified; native 16:9 fallback has no forced relayout.'
          echo '--- launch configuration after compatibility patch ---'
          plutil -p source/output/Info.plist | grep -E 'UILaunch|UIRequiresFullScreen' || true
          echo '--- exported native AI plugin ---'
          find source/output -name 'libkoishi_ocgcore.a' -print
          grep -n 'libkoishi_ocgcore.a' source/output/Unity-iPhone.xcodeproj/project.pbxproj | head -20

      - name: Build unsigned iOS app with Xcode
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          cd source/output
          xcodebuild \
            -quiet \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            ENABLE_BITCODE=NO \
            ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME=LaunchImage \
            build

      - name: Package TrollStore IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"

          echo '--- final app launch configuration ---'
          plutil -p "$APP/Info.plist" | grep -E 'UILaunch|UIRequiresFullScreen' || true
          if /usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$APP/Info.plist" >/dev/null 2>&1; then
            echo 'Unexpected iPhone base launch storyboard remains; refusing to package.'
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName~iphone' "$APP/Info.plist" >/dev/null 2>&1; then
            echo 'Unexpected iPhone-specific launch storyboard remains; refusing to package.'
            exit 1
          fi
          for key in UILaunchScreen UILaunchScreens UILaunchStoryboards; do
            if /usr/libexec/PlistBuddy -c "Print :$key" "$APP/Info.plist" >/dev/null 2>&1; then
              echo "Unexpected modern launch declaration remains in final app: $key"
              exit 1
            fi
          done

          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa
          /usr/bin/zip -qry ../KoishiPro2-unsigned.ipa Payload
          cd ..
          shasum -a 256 KoishiPro2-unsigned.ipa > KoishiPro2-unsigned.ipa.sha256
          ls -lh KoishiPro2-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KoishiPro2-iOS-cloud-build
          path: |
            KoishiPro2-unsigned.ipa
            KoishiPro2-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 1
