name: Koishi AI prefab reference inspection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-prefab-reference-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: c1850e1120df6a5885692eadacad8ad114a3cf11
    steps:
      - uses: actions/checkout@v7
        with:
          path: control
      - uses: actions/cache/restore@v6
        with:
          path: source
          key: koishipro2-source-${{ env.SOURCE_COMMIT }}-v1
      - name: Trace AI prefab references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== prefab GUIDs ==='
          for f in source/Assets/transUI/prefab/trans_AIroom.prefab.meta source/Assets/ArtSystem/Room/new_room_ai.prefab.meta; do
            echo "--- $f ---"
            cat "$f"
          done

          TGUID=$(awk '/^guid:/{print $2;exit}' source/Assets/transUI/prefab/trans_AIroom.prefab.meta)
          NGUID=$(awk '/^guid:/{print $2;exit}' source/Assets/ArtSystem/Room/new_room_ai.prefab.meta)
          echo "trans_AIroom=$TGUID"
          echo "new_room_ai=$NGUID"

          echo '=== refs to trans_AIroom ==='
          grep -Rni -B8 -A15 "$TGUID" source/Assets --exclude='*.meta' | head -800 || true
          echo '=== refs to new_room_ai ==='
          grep -Rni -B8 -A15 "$NGUID" source/Assets --exclude='*.meta' | head -800 || true

          echo '=== Program new_ui_aiRoom references ==='
          grep -Rni -B20 -A40 --include='*.cs' --include='*.prefab' --include='*.unity' 'new_ui_aiRoom' source/Assets | head -1200 || true

          echo '=== mainWindow occurrences in new_room_ai ==='
          grep -n -B30 -A100 'm_Name: mainWindow' source/Assets/ArtSystem/Room/new_room_ai.prefab || true

          echo '=== new_room_ai 500x400-like widgets ==='
          grep -n -B25 -A60 -E 'mWidth: (4[5-9][0-9]|5[0-9][0-9])|mHeight: (3[5-9][0-9]|4[0-9][0-9])' source/Assets/ArtSystem/Room/new_room_ai.prefab | head -2000 || true
