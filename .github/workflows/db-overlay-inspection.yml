name: KoishiPro2 official cards database overlay inspection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/db-overlay-inspection.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 16
    steps:
      - name: Restore fixed Koishi source cache
        uses: actions/cache/restore@v6
        with:
          path: source
          key: koishipro2-source-c1850e1120df6a5885692eadacad8ad114a3cf11-v1
      - name: Fetch exact KoishiPro2 source when cache has expired
        shell: bash
        env:
          SOURCE_REPO: https://code.moenext.com/hex/ygopro2.git
          SOURCE_COMMIT: c1850e1120df6a5885692eadacad8ad114a3cf11
        run: |
          set -euo pipefail
          if [ -d source/.git ] && [ "$(git -C source rev-parse HEAD 2>/dev/null || true)" = "$SOURCE_COMMIT" ]; then
            echo "Using cached exact revision."
          else
            rm -rf source
            mkdir source
            git -C source init -q
            git -C source remote add origin "$SOURCE_REPO"
            git -C source config http.version HTTP/1.1
            for attempt in 1 2 3; do
              if git -C source fetch --quiet --no-tags --depth=1 origin "$SOURCE_COMMIT"; then
                git -C source checkout --quiet --detach FETCH_HEAD
                break
              fi
              echo "Source fetch attempt $attempt failed; retrying."
            done
          fi
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Audit settings opt-in DB update and startup callback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path('source/Assets')
          if not base.exists():
              print('NO_CACHE')
              raise SystemExit(1)
          terms=re.compile(r'RetryBasicDataUpdate|UpdateClientCoroutine|UseBundledBasicData|InitializeBasicDataSyncState|auto.?update|update.?db|db.?update|update.?card|update.?data|data.?update|自动更新|数据库更新|更新数据库|データベース更新|DBのアップデート|基本数据更新|auto.?sync|sync.?auto|database.?sync|dbAuto|dbupdate|db_update',re.I)
          for p in sorted(base.rglob('*')):
              if p.suffix.lower() not in ('.cs','.conf','.txt','.json','.xml','.prefab','.asset'): continue
              if not p.is_file() or p.stat().st_size > 700000:continue
              try: ss=p.read_text(encoding='utf-8-sig')
              except (UnicodeError,OSError):continue
              lines=ss.splitlines()
              hits=[i for i,x in enumerate(lines) if terms.search(x)]
              if not hits:continue
              print('MATCH FILE',p,'HITS',len(hits))
              max_lines=330 if p.name=='Program.cs' else 160
              spans=[]
              for i in hits[:65]:
                  lo=max(0,i-(12 if p.name=='Program.cs' else 5))
                  hi=min(len(lines),i+(22 if p.name=='Program.cs' else 12))
                  if spans and lo<=spans[-1][1]:spans[-1][1]=max(hi,spans[-1][1])
                  else:spans.append([lo,hi])
              printed=0
              for lo,hi in spans:
                  if printed>=max_lines:break
                  for j in range(lo,min(hi,lo+max_lines-printed)):
                      print(f'{j+1:05d} {lines[j][:210]}')
                      printed+=1
                  print('---')
          PY
