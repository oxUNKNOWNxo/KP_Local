name: KoishiPro2 official cards database overlay inspection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/db-overlay-inspection.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - name: Restore fixed Koishi source cache
        uses: actions/cache/restore@v6
        with:
          path: source
          key: koishipro2-source-c1850e1120df6a5885692eadacad8ad114a3cf11-v1
      - name: Inspect source card load/update/pack extraction logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path('source/Assets')
          expected=base/'SibylSystem/Program.cs'
          if not expected.exists():
              print('SOURCE_CACHE_UNAVAILABLE')
              raise SystemExit(0)
          for rel in ('SibylSystem/Program.cs','SibylSystem/Menu/Menu.cs'):
              p=base/rel
              if not p.exists():continue
              src=p.read_text(encoding='utf-8-sig',errors='replace').splitlines()
              print('FILE',rel,'lines',len(src))
              hits=[i for i,l in enumerate(src) if re.search('LoadDatabaseFile|CardsManager\\.initialize|expansions|test-update\\.cdb|test-release\\.cdb|DownloadAndApplySuperPre|DownloadFileWithHeadCheck|ExtractZip|ReloadGameDatabases|Register.*Database|SearchDatabase',l,re.I)]
              blocks=[]
              for i in hits:
                  lo=max(0,i-7);hi=min(len(src),i+12)
                  if blocks and lo<=blocks[-1][1]:blocks[-1][1]=max(hi,blocks[-1][1])
                  else: blocks.append([lo,hi])
              linesprinted=0
              for lo,hi in blocks:
                  if linesprinted>1000:break
                  for i in range(lo,hi):
                      print(f'{i+1:05d} {src[i][:220]}')
                  print('---')
                  linesprinted+=hi-lo
          for p in base.rglob('CardsManager.cs'):
              print('FILE',p,'lines')
              src=p.read_text(encoding='utf-8-sig',errors='replace').splitlines()
              for i,l in enumerate(src):
                  if re.search('initialize|setcode|alias|dictionary|SELECT|datas|cache|clear|reload',l,re.I):
                      lo=max(0,i-2);hi=min(len(src),i+5)
                      print(' / '.join(f'{j+1}:{src[j][:220]}' for j in range(lo,hi)))
          PY
