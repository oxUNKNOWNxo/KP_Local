name: KoishiPro2 official cards database overlay inspection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/db-overlay-inspection.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 16
    steps:
      - name: Restore fixed Koishi source cache
        uses: actions/cache/restore@v6
        with:
          path: source
          key: koishipro2-source-c1850e1120df6a5885692eadacad8ad114a3cf11-v1
      - name: Fetch exact KoishiPro2 source when cache has expired
        shell: bash
        env:
          SOURCE_REPO: https://code.moenext.com/hex/ygopro2.git
          SOURCE_COMMIT: c1850e1120df6a5885692eadacad8ad114a3cf11
        run: |
          set -euo pipefail
          if [ -d source/.git ] && [ "$(git -C source rev-parse HEAD 2>/dev/null || true)" = "$SOURCE_COMMIT" ]; then
            echo "Using cached exact revision."
          else
            rm -rf source
            mkdir source
            git -C source init -q
            git -C source remote add origin "$SOURCE_REPO"
            git -C source config http.version HTTP/1.1
            for attempt in 1 2 3; do
              if git -C source fetch --quiet --no-tags --depth=1 origin "$SOURCE_COMMIT"; then
                git -C source checkout --quiet --detach FETCH_HEAD
                break
              fi
              echo "Source fetch attempt $attempt failed; retrying."
            done
          fi
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Save exact KoishiPro2 source snapshot cache
        uses: actions/cache/save@v6
        with:
          path: source
          key: koishipro2-source-c1850e1120df6a5885692eadacad8ad114a3cf11-v1
      - name: Inspect opt-in update setting and startup call context
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('source/Assets')
          relevant=(
            root/'SibylSystem/Program.cs',
            root/'SibylSystem/Setting/Setting.cs',
            root/'SibylSystem/Config.cs',
          )
          for p in relevant:
            if not p.exists():
              print('NOT_FOUND',p)
              continue
            lines=p.read_text(encoding='utf-8-sig',errors='replace').splitlines()
            matches=[]
            for i,line in enumerate(lines):
              if re.search(r'RetryBasicDataUpdate|AutoPicDownload|autoPicDownload|UpdateClientCoroutine|UseBundledBasicData|Enable.*Update|Update.*DB|DB.*Update|Auto.*Update|DB|Config.Get|Config.Set',line,re.I):
                matches.append(i)
            print('FILE',p,'TOTAL',len(lines),'MATCH_COUNT',len(matches))
            spans=[]
            for i in matches[:200]:
              lo=max(0,i-23 if 'Program.cs' in str(p) else i-8)
              hi=min(len(lines),i+24 if 'Program.cs' in str(p) else i+9)
              if spans and lo<=spans[-1][1]:
                spans[-1][1]=max(hi,spans[-1][1])
              else:
                spans.append([lo,hi])
            printed=0
            for lo,hi in spans:
              if printed>700:break
              for j in range(lo,hi):
                print(f'{j+1:05d} {lines[j][:260]}')
                printed+=1
              print('---')
          for p in sorted(root.rglob('*.cs')):
            if p in relevant or p.stat().st_size>550000:continue
            try: text=p.read_text(encoding='utf-8-sig')
            except (OSError,UnicodeError):continue
            if re.search(r'AutoPicDownload|RetryBasicDataUpdate|DB.?Update|Update.?DB|Enable.?DB',text,re.I):
              print('OTHER',p)
              lines=text.splitlines()
              for i,line in enumerate(lines):
                if re.search(r'AutoPicDownload|RetryBasicDataUpdate|DB.?Update|Update.?DB|Enable.?DB',line,re.I):
                  print(f'{i+1:05d}',line[:230])
          PY
