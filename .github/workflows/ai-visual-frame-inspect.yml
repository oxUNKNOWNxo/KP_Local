name: Koishi AI visual frame inspection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-visual-frame-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: c1850e1120df6a5885692eadacad8ad114a3cf11
    steps:
      - uses: actions/checkout@v7
        with:
          path: control
      - uses: actions/cache/restore@v6
        with:
          path: source
          key: koishipro2-source-${{ env.SOURCE_COMMIT }}-v1
      - name: Inspect complete AI room visual hierarchy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path("source/Assets")
          p=root/"transUI/prefab/trans_AIroom.prefab"
          text=p.read_text(encoding="utf-8-sig",errors="replace")
          docs=re.split(r'(?=--- !u!)', text)

          def meta_guid(rel):
              t=(root/rel).read_text(encoding="utf-8-sig",errors="replace")
              m=re.search(r'(?m)^guid:\s*([0-9a-f]+)',t)
              return m.group(1) if m else None

          guids={
              "UISprite":meta_guid("NGUI/Scripts/UI/UISprite.cs.meta"),
              "UILabel":meta_guid("NGUI/Scripts/UI/UILabel.cs.meta"),
              "UIPanel":meta_guid("NGUI/Scripts/UI/UIPanel.cs.meta"),
              "UITexture":meta_guid("NGUI/Scripts/UI/UITexture.cs.meta"),
              "UIWidget":meta_guid("NGUI/Scripts/UI/UIWidget.cs.meta") if (root/"NGUI/Scripts/UI/UIWidget.cs.meta").exists() else None,
          }
          print("GUIDS",guids)

          gos={}
          transforms={}
          go_components={}
          compdocs={}
          tf_by_go={}
          for d in docs:
              h=re.match(r'--- !u!(\d+) &(\d+)',d)
              if not h: continue
              typ,fid=h.groups()
              compdocs[fid]=(typ,d)
              if typ=="1":
                  n=re.search(r'(?m)^  m_Name:\s*(.*?)\s*$',d)
                  gos[fid]=n.group(1) if n else ""
              go=re.search(r'm_GameObject: \{fileID: (\d+)\}',d)
              if go:
                  go_components.setdefault(go.group(1),[]).append(fid)
              if typ=="4":
                  goid=go.group(1) if go else ""
                  father=re.search(r'm_Father: \{fileID: (\d+)\}',d)
                  pos=re.search(r'm_LocalPosition: \{x: ([^,]+), y: ([^,]+), z: ([^}]+)\}',d)
                  scale=re.search(r'm_LocalScale: \{x: ([^,]+), y: ([^,]+), z: ([^}]+)\}',d)
                  children=re.findall(r'- \{fileID: (\d+)\}',d)
                  transforms[fid]={
                      "go":goid,
                      "father":father.group(1) if father else "0",
                      "pos":pos.groups() if pos else None,
                      "scale":scale.groups() if scale else None,
                      "children":children,
                  }
                  if goid: tf_by_go[goid]=fid

          roots=[]
          for tf,data in transforms.items():
              if data["father"]=="0":
                  roots.append(tf)
          print("ROOT_TFS",roots)
          for tf in roots:
              go=transforms[tf]["go"]
              print("ROOT",gos.get(go),go,tf,transforms[tf])

          def chain_for_tf(tf):
              out=[]
              seen=set()
              while tf and tf!="0" and tf not in seen and tf in transforms:
                  seen.add(tf)
                  d=transforms[tf]
                  out.append((gos.get(d["go"]),d["go"],tf,d["pos"],d["scale"]))
                  tf=d["father"]
              return out

          print("=== ALL TRANSFORMS depth/order ===")
          def walk(tf,depth=0):
              if tf not in transforms: return
              d=transforms[tf]
              print("  "*depth + f"{gos.get(d['go'])!r} go={d['go']} tf={tf} pos={d['pos']} scale={d['scale']}")
              for c in d["children"]:
                  walk(c,depth+1)
          for tf in roots:
              walk(tf)

          print("=== ALL VISUAL/LAYOUT COMPONENTS ===")
          for go,name in gos.items():
              entries=[]
              for cid in go_components.get(go,[]):
                  typ,d=compdocs[cid]
                  if typ=="4": continue
                  sm=re.search(r'm_Script: \{fileID: 11500000, guid: ([0-9a-f]+),',d)
                  guid=sm.group(1) if sm else ""
                  cls=next((k for k,v in guids.items() if v==guid),"")
                  width=re.search(r'(?m)^  mWidth:\s*([-0-9.]+)',d)
                  height=re.search(r'(?m)^  mHeight:\s*([-0-9.]+)',d)
                  sprite=re.search(r'(?m)^  mSpriteName:\s*(.*)$',d)
                  color=re.search(r'(?m)^  mColor:\s*\{([^}]+)\}',d)
                  depthm=re.search(r'(?m)^  mDepth:\s*([-0-9]+)',d)
                  clip=re.search(r'(?m)^  mClipRange:\s*\{([^}]+)\}',d)
                  alpha=re.search(r'(?m)^  mAlpha:\s*([-0-9.]+)',d)
                  if cls or width or height or clip:
                      entries.append({
                          "cid":cid,"type":typ,"class":cls,"guid":guid,
                          "w":width.group(1) if width else "",
                          "h":height.group(1) if height else "",
                          "sprite":sprite.group(1).strip() if sprite else "",
                          "color":color.group(1) if color else "",
                          "depth":depthm.group(1) if depthm else "",
                          "clip":clip.group(1) if clip else "",
                          "alpha":alpha.group(1) if alpha else "",
                      })
              if entries:
                  tf=tf_by_go.get(go)
                  print("OBJECT",repr(name),"go",go,"tf",tf,"chain",chain_for_tf(tf))
                  for e in entries:
                      print(" ",e)

          print("=== MAINWINDOW RAW UISPRITE ===")
          main_go=next(g for g,n in gos.items() if n=="mainWindow")
          for cid in go_components.get(main_go,[]):
              typ,d=compdocs[cid]
              if guids["UISprite"] and guids["UISprite"] in d:
                  print(d)

          print("=== TOPLEVEL PARENT COMPONENTS ===")
          mtf=tf_by_go[main_go]
          parent_tf=transforms[mtf]["father"]
          while parent_tf!="0" and parent_tf in transforms:
              go=transforms[parent_tf]["go"]
              print("PARENT",gos.get(go),go,parent_tf)
              for cid in go_components.get(go,[]):
                  typ,d=compdocs[cid]
                  print("---",cid,typ,"---")
                  print(d[:5000])
              parent_tf=transforms[parent_tf]["father"]
          PY
