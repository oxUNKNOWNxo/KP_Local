name: KoishiPro2 AI history inspection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ai-history-inspect.yml'

permissions:
  contents: read

concurrency:
  group: koishipro2-ai-history-inspection
  cancel-in-progress: true

jobs:
  inspect:
    if: github.actor == github.repository_owner && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_REPO: https://code.moenext.com/hex/ygopro2.git
      SOURCE_COMMIT: c1850e1120df6a5885692eadacad8ad114a3cf11
      REMOVAL_COMMIT: 1cd5d12ad7b888b8774da7d67c8dba9898a108ee
    steps:
      - name: Fetch KoishiPro2 history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source inspection
          git clone --filter=blob:none --no-checkout "$SOURCE_REPO" source
          git -C source config http.version HTTP/1.1
          git -C source checkout --detach "$SOURCE_COMMIT"
          mkdir -p inspection
          git -C source log --all --date=iso --pretty=format:'%H %ad %s' > inspection/git-log.txt

      - name: Recover removed local AI implementation
        shell: bash
        run: |
          set -euo pipefail
          cd source
          AIR=$(find Assets -type f -name 'AIRoom.cs' -print -quit)
          MENU=$(find Assets -type f -name 'Menu.cs' -print -quit)
          printf '%s\n' "$AIR" > ../inspection/AIRoom-path.txt
          printf '%s\n' "$MENU" > ../inspection/Menu-path.txt
          test -n "$AIR"
          test -n "$MENU"

          {
            echo '=== AIRoom file history ==='
            git log --all --follow --date=iso --pretty=format:'%H %ad %s' -- "$AIR" || true
            echo
            echo '=== commits changing removed-local-AI marker ==='
            git log --all -S'本地AI模式已移除' --date=iso --pretty=format:'%H %ad %s' -- "$AIR" "$MENU" || true
            echo
            echo '=== commits mentioning AIRoom/AI in patches ==='
            git log --all -G'AIRoom|aiRoom|onClickAI|ai/ydk|Percy AI' --date=iso --pretty=format:'%H %ad %s' -- "$AIR" "$MENU" || true
          } > ../inspection/ai-history.txt

          mkdir -p ../inspection/airoom-revisions
          git show HEAD:"$AIR" > ../inspection/airoom-revisions/current-AIRoom.cs
          git log --all --follow --format='%H' -- "$AIR" | while read -r sha; do
            if git cat-file -e "$sha:$AIR" 2>/dev/null; then
              git show "$sha:$AIR" > "../inspection/airoom-revisions/${sha}-AIRoom.cs" || true
            fi
          done

          parent="${REMOVAL_COMMIT}^"
          git rev-parse "$parent" > ../inspection/pre-removal-parent.txt
          mkdir -p ../inspection/pre-removal
          for path in \
            Assets/SibylSystem/Room/AIRoom.cs \
            Assets/SibylSystem/Menu/Menu.cs \
            Assets/SibylSystem/coreWrapper.cs \
            Assets/SibylSystem/coreWrapper.cs.meta \
            Assets/SibylSystem/precy.cs \
            Assets/SibylSystem/precy.cs.meta \
            Assets/SibylSystem/puzzleSystem/puzzleMode.cs; do
            if git cat-file -e "$parent:$path" 2>/dev/null; then
              mkdir -p "../inspection/pre-removal/$(dirname "$path")"
              git show "$parent:$path" > "../inspection/pre-removal/$path"
            fi
          done

          git show --stat --oneline "$REMOVAL_COMMIT" > ../inspection/removal-stat.txt
          git show --format=fuller --find-renames "$REMOVAL_COMMIT" > ../inspection/removal-full.patch

          # Record every file that existed immediately before removal and is related to
          # the local duel engine, native plugins, AI scripts/decks, or managed wrappers.
          git ls-tree -r --name-only "$parent" | \
            grep -Ei '(^|/)(ai|ocgcore|plugins|precy|corewrapper|windbot|ygopro|duel|server|bot)(/|\.|$)' \
            > ../inspection/pre-removal-engine-paths.txt || true

          # Find native libraries and plugin metadata that may be required on iOS.
          git ls-tree -r --name-only "$parent" | \
            grep -Ei '\.(a|so|dylib|bundle|framework|dll|aar|jar|meta)$' | \
            grep -Ei 'ocg|core|ygopro|precy|ai|wind|plugin' \
            > ../inspection/pre-removal-native-candidates.txt || true

          # Save histories for the two deleted managed wrappers.
          {
            echo '=== coreWrapper.cs history ==='
            git log --all --follow --date=iso --pretty=format:'%H %ad %s' -- Assets/SibylSystem/coreWrapper.cs || true
            echo
            echo '=== precy.cs history ==='
            git log --all --follow --date=iso --pretty=format:'%H %ad %s' -- Assets/SibylSystem/precy.cs || true
          } > ../inspection/wrapper-history.txt

          # Capture the exact pre-removal wrapper source dependencies.
          grep -RniE 'DllImport|extern |ocgcore|ygopro|WindBot|startAI|create_duel|process|set_card_reader|set_script_reader|set_message_handler|load_script' \
            ../inspection/pre-removal/Assets/SibylSystem 2>/dev/null \
            > ../inspection/wrapper-dependencies.txt || true

          {
            echo '=== current AI/duel-related paths ==='
            git ls-tree -r --name-only HEAD | grep -Ei '(^|/)(ai|windbot|ocgcore|ygopro|duel|server|bot)(/|\.|$)' || true
            echo
            echo '=== historical filenames containing windbot/ocgcore/server ==='
            git log --all --name-only --pretty=format: | grep -Ei 'windbot|ocgcore|duelserver|ygopro.*server|server.*ygopro|ai/' | sort -u || true
          } > ../inspection/engine-paths.txt

          cd ..
          zip -qry KoishiPro2-ai-history-inspection.zip inspection
          ls -lh KoishiPro2-ai-history-inspection.zip

      - name: Upload AI history inspection
        uses: actions/upload-artifact@v4
        with:
          name: KoishiPro2-ai-history-inspection
          path: KoishiPro2-ai-history-inspection.zip
          if-no-files-found: error
          retention-days: 1
