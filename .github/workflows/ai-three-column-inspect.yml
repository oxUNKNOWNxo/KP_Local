name: Koishi AI three-column UI inspection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-three-column-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: c1850e1120df6a5885692eadacad8ad114a3cf11
    steps:
      - uses: actions/checkout@v7
        with:
          path: control
      - uses: actions/cache/restore@v6
        with:
          path: source
          key: koishipro2-source-${{ env.SOURCE_COMMIT }}-v1
      - name: Inspect AI prefab selectable-list hierarchy
        shell: bash
        run: |
          set -euo pipefail
          PREFAB=source/Assets/ArtSystem/Room/new_room_ai.prefab
          META=source/Assets/transUI/UIselectableList.cs.meta
          GUID=$(awk '/^guid:/{print $2; exit}' "$META")
          echo "UIselectableList guid=$GUID"
          grep -n -B80 -A180 "$GUID" "$PREFAB" || true
          echo '===== named control transforms ====='
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("source/Assets/ArtSystem/Room/new_room_ai.prefab")
          text=p.read_text(encoding="utf-8-sig",errors="replace")
          docs=re.split(r'(?=--- !u!)', text)
          go_names={}
          transforms={}
          for d in docs:
              m=re.match(r'--- !u!1 &(\d+)',d)
              if m:
                  fid=m.group(1)
                  n=re.search(r'\n  m_Name: (.+)',d)
                  if n: go_names[fid]=n.group(1).strip()
                  continue
              m=re.match(r'--- !u!4 &(\d+)',d)
              if m:
                  fid=m.group(1)
                  go=re.search(r'm_GameObject: \{fileID: (\d+)\}',d)
                  father=re.search(r'm_Father: \{fileID: (\d+)\}',d)
                  pos=re.search(r'm_LocalPosition: \{x: ([^,]+), y: ([^,]+), z: ([^}]+)\}',d)
                  transforms[fid]=(go.group(1) if go else "",father.group(1) if father else "",pos.groups() if pos else None)
          parent_go={}
          for tf,(go,father,pos) in transforms.items():
              if go:
                  parent_go[go]=tf
          wanted={"aideck_","rank_","life_","mr4_","unrand_","first_","god_","panel_","start_","exit_","percyHint","btns"}
          for go,name in go_names.items():
              if name in wanted:
                  tf=parent_go.get(go)
                  data=transforms.get(tf)
                  print(name, "go",go,"tf",tf,"data",data)
          print("===== selectable-list component owners =====")
          guid=Path("source/Assets/transUI/UIselectableList.cs.meta").read_text().split("guid: ")[1].splitlines()[0].strip()
          for d in docs:
              if guid not in d:
                  continue
              go=re.search(r'm_GameObject: \{fileID: (\d+)\}',d)
              if not go: continue
              gid=go.group(1)
              print("owner",gid,go_names.get(gid))
              print(d[:2500])
          PY
