# inspection trigger: runtime wiring verification
name: KoishiPro2 runtime UI inspection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/runtime-ui-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_REPO: https://code.moenext.com/hex/ygopro2.git
      SOURCE_COMMIT: c1850e1120df6a5885692eadacad8ad114a3cf11
      AI_REMOVAL_COMMIT: 1cd5d12ad7b888b8774da7d67c8dba9898a108ee
    steps:
      - uses: actions/checkout@v4
        with:
          path: control

      - name: Fetch current and pre-removal source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          git init -q source
          git -C source remote add origin "$SOURCE_REPO"
          git -C source config http.version HTTP/1.1
          git -C source fetch --quiet --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git -C source checkout --quiet --detach FETCH_HEAD
          git -C source fetch --quiet --no-tags --depth=2 origin "$AI_REMOVAL_COMMIT" || true

      - name: Inspect live menu and AI asset wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('source/Assets')
          out = Path('runtime-ui-report.txt')
          lines = []
          def add(s=''):
              lines.append(str(s))

          add('=== Menu.cs relevant lines ===')
          menu = root/'SibylSystem/Menu/Menu.cs'
          text = menu.read_text(encoding='utf-8-sig', errors='replace')
          for i,l in enumerate(text.splitlines(),1):
              if any(k in l for k in ['createWindow(', 'ai_', 'onClickAI', 'new_ui_menu', 'single_', 'SetActive']):
                  add(f'{i}: {l}')

          add('\n=== Program.cs menu/AI asset fields and initialization ===')
          program = root/'SibylSystem/Program.cs'
          ptext = program.read_text(encoding='utf-8-sig', errors='replace')
          for i,l in enumerate(ptext.splitlines(),1):
              if any(k in l for k in ['new_ui_menu', 'new_ui_aiRoom', 'aiRoom', 'new_main_menu', 'trans_menu']):
                  add(f'{i}: {l}')

          add('\n=== ai_ and single_ GameObjects in YAML assets ===')
          for path in list(root.rglob('*.prefab')) + list(root.rglob('*.unity')) + list(root.rglob('*.asset')):
              try: raw=path.read_text(encoding='utf-8-sig', errors='replace')
              except: continue
              rows=raw.splitlines()
              for idx,row in enumerate(rows):
                  if row.strip() in ('m_Name: ai_', 'm_Name: single_'):
                      start=max(0, idx-28); end=min(len(rows), idx+70)
                      add(f'--- {path} lines {start+1}-{end} / {row.strip()} ---')
                      for j in range(start,end): add(f'{j+1}: {rows[j]}')

          add('\n=== single-related labels/text around menu assets ===')
          for path in list(root.rglob('*.prefab')):
              try: raw=path.read_text(encoding='utf-8-sig', errors='replace')
              except: continue
              if 'single_' not in raw:
                  continue
              rows=raw.splitlines()
              for i,row in enumerate(rows):
                  if row.strip() == 'm_Name: single_':
                      lo=max(0,i-120); hi=min(len(rows),i+180)
                      for j in range(lo,hi):
                          if any(k in rows[j] for k in ['m_Name:', 'mText:', 'm_Text:', 'm_Father:', 'm_Children:', 'm_IsActive:', 'm_LocalPosition:']):
                              add(f'{path}:{j+1}: {rows[j]}')

          add('\n=== All code that references AI/single entry ===')
          for path in root.rglob('*.cs'):
              try: t=path.read_text(encoding='utf-8-sig', errors='replace')
              except: continue
              for i,l in enumerate(t.splitlines(),1):
                  if 'ai_' in l or 'onClickAI' in l or 'single_' in l or 'onClickPizzle' in l:
                      add(f'{path}:{i}: {l}')

          out.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Inspect deck-list density and font geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('source/Assets')
          out = Path('deck-ui-report.txt')
          lines = []
          def add(s=''):
              lines.append(str(s))

          add('=== C# files referencing deck lists / UIselectableList ===')
          terms = (
              'UIselectableList', 'deckManager', 'DeckManager', 'deckInUse',
              'sortByTimeDeck', '卡组管理', '卡组管理器'
          )
          for path in root.rglob('*.cs'):
              try:
                  text = path.read_text(encoding='utf-8-sig', errors='replace')
              except Exception:
                  continue
              rows = text.splitlines()
              hits = [i for i,row in enumerate(rows) if any(t in row for t in terms)]
              if not hits:
                  continue
              add(f'--- {path} ---')
              shown = set()
              for idx in hits:
                  lo=max(0,idx-12); hi=min(len(rows),idx+20)
                  for j in range(lo,hi):
                      if j in shown:
                          continue
                      shown.add(j)
                      add(f'{j+1}: {rows[j]}')

          add('\n=== Prefabs/assets with deck list names and typography/spacing ===')
          yaml_terms = ('deck', 'Deck', '卡组', 'list_', 'UIselectableList')
          prop_terms = (
              'm_Name:', 'm_LocalPosition:', 'm_LocalScale:', 'mFontSize:',
              'fontSize:', 'mWidth:', 'mHeight:', 'mClipRange:', 'mSpacing:',
              'cellHeight', 'padding', 'mPivot:', 'mOverflow:', 'mMaxLineCount:'
          )
          for path in list(root.rglob('*.prefab')) + list(root.rglob('*.asset')):
              try:
                  raw = path.read_text(encoding='utf-8-sig', errors='replace')
              except Exception:
                  continue
              rows = raw.splitlines()
              hits = [i for i,row in enumerate(rows) if any(t in row for t in yaml_terms)]
              if not hits:
                  continue
              relevant=[]
              for idx in hits[:80]:
                  lo=max(0,idx-45); hi=min(len(rows),idx+90)
                  chunk=[f'{j+1}: {rows[j]}' for j in range(lo,hi)
                         if any(p in rows[j] for p in prop_terms)]
                  if chunk:
                      relevant.extend(chunk)
              if relevant:
                  add(f'--- {path} ---')
                  # preserve order while removing duplicate lines
                  seen=set()
                  for row in relevant:
                      if row not in seen:
                          seen.add(row)
                          add(row)

          out.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Inspect pre-removal AI/menu source
        shell: bash
        run: |
          set -euo pipefail
          PRE=$(git -C source rev-parse "$AI_REMOVAL_COMMIT^" 2>/dev/null || true)
          echo "pre-removal commit: $PRE" | tee pre-removal-report.txt
          if [ -n "$PRE" ]; then
            for f in \
              Assets/SibylSystem/Menu/Menu.cs \
              Assets/SibylSystem/Program.cs \
              Assets/ArtSystem/MainMenu/new_main_menu.prefab \
              Assets/ArtSystem/MainMenu/new_main_menuR.prefab \
              Assets/transUI/prefab/trans_menu.prefab; do
              echo "===== $f =====" | tee -a pre-removal-report.txt
              git -C source show "$PRE:$f" 2>/dev/null | grep -n -B28 -A70 -E 'm_Name: ai_|m_Name: single_|onClickAI|onClickPizzle|new_ui_menu|new_ui_aiRoom|aiRoom' | tee -a pre-removal-report.txt || true
            done
          fi

      - name: Upload UI inspection
        uses: actions/upload-artifact@v4
        with:
          name: KoishiPro2-runtime-ui-inspection
          path: |
            runtime-ui-report.txt
            pre-removal-report.txt
            deck-ui-report.txt
          if-no-files-found: error
          retention-days: 1
