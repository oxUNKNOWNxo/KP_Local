# inspection trigger: runtime wiring verification
name: KoishiPro2 runtime UI inspection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/runtime-ui-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      SOURCE_REPO: https://code.moenext.com/hex/ygopro2.git
      SOURCE_COMMIT: c1850e1120df6a5885692eadacad8ad114a3cf11
      AI_REMOVAL_COMMIT: 1cd5d12ad7b888b8774da7d67c8dba9898a108ee
    steps:
      - uses: actions/checkout@v4
        with:
          path: control

      - name: Restore fixed KoishiPro2 source snapshot
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: source
          key: koishipro2-source-${{ env.SOURCE_COMMIT }}-v1

      - name: Fetch current and pre-removal source
        shell: bash
        run: |
          set -euo pipefail
          if [ -d source/.git ] && [ "$(git -C source rev-parse HEAD 2>/dev/null || true)" = "$SOURCE_COMMIT" ]; then
            echo "Using cached KoishiPro2 source snapshot."
          else
            rm -rf source
            git init -q source
            git -C source remote add origin "$SOURCE_REPO"
            git -C source config http.version HTTP/1.1
            git -C source fetch --quiet --no-tags --depth=1 origin "$SOURCE_COMMIT"
            git -C source checkout --quiet --detach FETCH_HEAD
          fi
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Inspect live menu and AI asset wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('source/Assets')
          out = Path('runtime-ui-report.txt')
          lines = []
          def add(s=''):
              lines.append(str(s))

          add('=== Menu.cs relevant lines ===')
          menu = root/'SibylSystem/Menu/Menu.cs'
          text = menu.read_text(encoding='utf-8-sig', errors='replace')
          for i,l in enumerate(text.splitlines(),1):
              if any(k in l for k in ['createWindow(', 'ai_', 'onClickAI', 'new_ui_menu', 'single_', 'SetActive']):
                  add(f'{i}: {l}')

          add('\n=== Program.cs menu/AI asset fields and initialization ===')
          program = root/'SibylSystem/Program.cs'
          ptext = program.read_text(encoding='utf-8-sig', errors='replace')
          for i,l in enumerate(ptext.splitlines(),1):
              if any(k in l for k in ['new_ui_menu', 'new_ui_aiRoom', 'aiRoom', 'new_main_menu', 'trans_menu']):
                  add(f'{i}: {l}')

          add('\n=== ai_ and single_ GameObjects in YAML assets ===')
          for path in list(root.rglob('*.prefab')) + list(root.rglob('*.unity')) + list(root.rglob('*.asset')):
              try: raw=path.read_text(encoding='utf-8-sig', errors='replace')
              except: continue
              rows=raw.splitlines()
              for idx,row in enumerate(rows):
                  if row.strip() in ('m_Name: ai_', 'm_Name: single_'):
                      start=max(0, idx-28); end=min(len(rows), idx+70)
                      add(f'--- {path} lines {start+1}-{end} / {row.strip()} ---')
                      for j in range(start,end): add(f'{j+1}: {rows[j]}')

          add('\n=== single-related labels/text around menu assets ===')
          for path in list(root.rglob('*.prefab')):
              try: raw=path.read_text(encoding='utf-8-sig', errors='replace')
              except: continue
              if 'single_' not in raw:
                  continue
              rows=raw.splitlines()
              for i,row in enumerate(rows):
                  if row.strip() == 'm_Name: single_':
                      lo=max(0,i-120); hi=min(len(rows),i+180)
                      for j in range(lo,hi):
                          if any(k in rows[j] for k in ['m_Name:', 'mText:', 'm_Text:', 'm_Father:', 'm_Children:', 'm_IsActive:', 'm_LocalPosition:']):
                              add(f'{path}:{j+1}: {rows[j]}')

          add('\n=== All code that references AI/single entry ===')
          for path in root.rglob('*.cs'):
              try: t=path.read_text(encoding='utf-8-sig', errors='replace')
              except: continue
              for i,l in enumerate(t.splitlines(),1):
                  if 'ai_' in l or 'onClickAI' in l or 'single_' in l or 'onClickPizzle' in l:
                      add(f'{path}:{i}: {l}')

          out.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Inspect deck-list density and font geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('source/Assets')
          out = Path('deck-ui-report.txt')
          lines = []
          def add(s=''):
              lines.append(str(s))

          # First locate only the managed sources that actually mention the
          # selectable-list/deck-manager mechanisms.
          source_hits = []
          source_terms = (
              'UIselectableList', 'deckInUse', 'sortByTimeDeck',
              'DeckManager', 'deckManager'
          )
          for path in (root/'SibylSystem').rglob('*.cs'):
              try:
                  text = path.read_text(encoding='utf-8-sig', errors='replace')
              except Exception:
                  continue
              if any(term in text for term in source_terms):
                  source_hits.append((path, text))

          add('=== Relevant managed sources ===')
          prefab_tokens = set()
          for path,text in source_hits:
              add(f'--- {path} ---')
              rows=text.splitlines()
              hit_lines=[i for i,row in enumerate(rows) if any(term in row for term in source_terms)]
              shown=set()
              for idx in hit_lines:
                  lo=max(0,idx-16); hi=min(len(rows),idx+28)
                  for j in range(lo,hi):
                      if j in shown:
                          continue
                      shown.add(j)
                      row=rows[j]
                      add(f'{j+1}: {row}')
                      for m in re.finditer(r'new_ui_[A-Za-z0-9_]+|trans_[A-Za-z0-9_]+', row):
                          prefab_tokens.add(m.group(0))

          # Then inspect only prefabs that either contain UIselectableList
          # serialization or are obvious deck-related UI assets.
          candidates=[]
          for path in root.rglob('*.prefab'):
              name=path.name.lower()
              if 'deck' in name or 'card' in name:
                  candidates.append(path)
                  continue
              try:
                  raw=path.read_text(encoding='utf-8-sig', errors='replace')
              except Exception:
                  continue
              if 'UIselectableList' in raw or any(tok in raw for tok in prefab_tokens):
                  candidates.append(path)

          add('\n=== Relevant prefab geometry ===')
          props = (
              'm_Name:', 'm_LocalPosition:', 'm_LocalScale:', 'mFontSize:',
              'mWidth:', 'mHeight:', 'mClipRange:', 'mOverflow:', 'mPivot:',
              'mod:', 'panel:', 'bar_', 'list_', 'deck'
          )
          seen_paths=set()
          for path in candidates[:80]:
              if path in seen_paths:
                  continue
              seen_paths.add(path)
              try:
                  raw=path.read_text(encoding='utf-8-sig', errors='replace')
              except Exception:
                  continue
              rows=raw.splitlines()
              # Only show windows around likely list/template objects.
              hits=[i for i,row in enumerate(rows)
                    if ('UIselectableList' in row
                        or 'm_Name: list_' in row
                        or 'm_Name: deck' in row.lower()
                        or 'm_Name: mod' in row)]
              if not hits:
                  continue
              add(f'--- {path} ---')
              shown=set()
              for idx in hits[:30]:
                  lo=max(0,idx-55); hi=min(len(rows),idx+110)
                  for j in range(lo,hi):
                      if j in shown:
                          continue
                      if any(p in rows[j] for p in props):
                          shown.add(j)
                          add(f'{j+1}: {rows[j]}')

          out.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Inspect selectable-list implementation and deck-manager prefab
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('source/Assets')
          out=Path('deck-list-definition-report.txt')
          lines=[]
          def add(x=''): lines.append(str(x))

          add('=== UIselectableList definition ===')
          defs=[]
          for p in root.rglob('*.cs'):
              try: t=p.read_text(encoding='utf-8-sig',errors='replace')
              except: continue
              if re.search(r'class\s+UIselectableList\b',t):
                  defs.append((p,t))
          for p,t in defs:
              add(f'--- {p} ---')
              for i,row in enumerate(t.splitlines(),1):
                  add(f'{i}: {row}')

          add('\n=== Program.remaster_deckManager serialized references ===')
          refs=[]
          for p in list(root.rglob('*.prefab'))+list(root.rglob('*.unity'))+list(root.rglob('*.asset')):
              try: t=p.read_text(encoding='utf-8-sig',errors='replace')
              except: continue
              if 'remaster_deckManager:' in t:
                  refs.append((p,t))
          guids=set()
          for p,t in refs:
              add(f'--- {p} ---')
              rows=t.splitlines()
              for i,row in enumerate(rows):
                  if 'remaster_deckManager:' not in row: continue
                  lo=max(0,i-4); hi=min(len(rows),i+6)
                  for j in range(lo,hi):
                      add(f'{j+1}: {rows[j]}')
                  m=re.search(r'guid:\s*([0-9a-fA-F]+)', row)
                  if m: guids.add(m.group(1))

          add(f'guids={sorted(guids)}')
          targets=[]
          for meta in root.rglob('*.meta'):
              try: mt=meta.read_text(encoding='utf-8-sig',errors='replace')
              except: continue
              for g in guids:
                  if f'guid: {g}' in mt:
                      targets.append(meta.with_suffix(''))
                      add(f'GUID {g} -> {meta.with_suffix("")}')

          props=('m_Name:','m_LocalPosition:','m_LocalScale:','mFontSize:','mWidth:',
                 'mHeight:','mClipRange:','mOverflow:','mPivot:','m_Script:','m_Enabled:',
                 'panel:','mod:','bar_','selected','items')
          add('\n=== remaster_deckManager prefab relevant geometry ===')
          for p in targets:
              if not p.is_file(): continue
              t=p.read_text(encoding='utf-8-sig',errors='replace')
              rows=t.splitlines()
              add(f'--- {p} ---')
              # Print all names/font/geometry, prefab is small enough and this
              # avoids missing the list template because scripts serialize by GUID.
              for i,row in enumerate(rows,1):
                  if any(k in row for k in props):
                      add(f'{i}: {row}')

          out.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Resolve UIselectableList prefab instances
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('source/Assets')
          meta=root/'transUI/UIselectableList.cs.meta'
          out=Path('selectable-prefab-report.txt')
          lines=[]
          def add(x=''): lines.append(str(x))

          mt=meta.read_text(encoding='utf-8-sig',errors='replace')
          m=re.search(r'^guid:\s*([0-9a-fA-F]+)',mt,re.M)
          if not m:
              raise SystemExit('UIselectableList guid not found')
          guid=m.group(1)
          add(f'UIselectableList guid={guid}')

          matches=[]
          for p in root.rglob('*.prefab'):
              try: t=p.read_text(encoding='utf-8-sig',errors='replace')
              except: continue
              if guid in t:
                  matches.append((p,t))

          add(f'prefab_count={len(matches)}')
          for p,t in matches:
              add(f'\n===== {p} =====')
              rows=t.splitlines()
              hit=[i for i,row in enumerate(rows) if guid in row]
              # Print component around UIselectableList reference.
              for idx in hit:
                  lo=max(0,idx-22); hi=min(len(rows),idx+32)
                  add(f'--- selectable component around line {idx+1} ---')
                  for j in range(lo,hi):
                      add(f'{j+1}: {rows[j]}')
              # Print all names and typography/geometry in this relatively
              # small UI prefab so mod/label relationships are visible.
              add('--- names / typography / geometry ---')
              keys=('m_Name:','m_LocalPosition:','m_LocalScale:','mFontSize:',
                    'mWidth:','mHeight:','mClipRange:','mOverflow:','mPivot:',
                    'm_Script:','mod:','panel:','scrollBar:')
              for i,row in enumerate(rows,1):
                  if any(k in row for k in keys):
                      add(f'{i}: {row}')

          out.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Resolve shared selectable-row prefab
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root=Path('source/Assets')
          guid='b102b714e94a8bf4abf4b4ada52e4158'
          out=Path('selectable-row-prefab.txt')
          lines=[]
          target=None
          for meta in root.rglob('*.meta'):
              try: text=meta.read_text(encoding='utf-8-sig',errors='replace')
              except: continue
              if f'guid: {guid}' in text:
                  target=meta.with_suffix('')
                  break
          lines.append(f'guid={guid}')
          lines.append(f'target={target}')
          if target and target.is_file():
              text=target.read_text(encoding='utf-8-sig',errors='replace')
              for i,row in enumerate(text.splitlines(),1):
                  lines.append(f'{i}: {row}')
          out.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Inspect untranslated Settings strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          assets = Path('source/Assets')
          control = Path('control')
          out = Path('settings-untranslated-report.txt')

          layout = (control/'patches/settings/SettingJapaneseLayout.cs').read_text(
              encoding='utf-8-sig', errors='replace')
          translated_keys = set(re.findall(
              r'\{\s*"((?:\\.|[^"])*)"\s*,\s*"',
              layout
          ))

          sources = []
          setting_cs = assets/'SibylSystem/Setting/Setting.cs'
          if setting_cs.is_file():
              sources.append(setting_cs)

          for p in assets.rglob('*.prefab'):
              if 'setting' in p.name.lower():
                  sources.append(p)

          # Also include any prefab explicitly referenced by new_ui_setting's
          # serialized GUID, if available.
          for p in list(assets.rglob('*.prefab')) + list(assets.rglob('*.unity')):
              try:
                  t = p.read_text(encoding='utf-8-sig', errors='replace')
              except Exception:
                  continue
              if 'new_ui_setting:' not in t:
                  continue
              for line in t.splitlines():
                  if 'new_ui_setting:' not in line:
                      continue
                  m = re.search(r'guid:\s*([0-9a-fA-F]+)', line)
                  if not m:
                      continue
                  guid = m.group(1)
                  for meta in assets.rglob('*.meta'):
                      try:
                          mt = meta.read_text(encoding='utf-8-sig', errors='replace')
                      except Exception:
                          continue
                      if f'guid: {guid}' in mt:
                          candidate = meta.with_suffix('')
                          if candidate.is_file():
                              sources.append(candidate)

          # Collect visible/static Chinese strings from UILabel YAML and string
          # literals in Setting.cs. Ignore comments and very long prose.
          chinese = re.compile(r'[\u3400-\u9fff]')
          candidates = {}
          def add(value, source):
              value = value.strip()
              if not value or not chinese.search(value):
                  return
              if len(value) > 80:
                  return
              candidates.setdefault(value, set()).add(str(source))

          for p in dict.fromkeys(sources):
              try:
                  text = p.read_text(encoding='utf-8-sig', errors='replace')
              except Exception:
                  continue
              if p.suffix == '.cs':
                  # Remove // comments before extracting string literals.
                  for lineno, row in enumerate(text.splitlines(), 1):
                      code = row.split('//', 1)[0]
                      for m in re.finditer(r'"((?:\\.|[^"])*)"', code):
                          add(m.group(1), f'{p}:{lineno}')
              else:
                  for lineno, row in enumerate(text.splitlines(), 1):
                      stripped = row.strip()
                      for prefix in ('mText:', 'text:', 'm_Text:'):
                          if stripped.startswith(prefix):
                              add(stripped[len(prefix):].strip().strip('"'),
                                  f'{p}:{lineno}')

          missing = [(k, sorted(v)) for k,v in candidates.items()
                     if k not in translated_keys]
          missing.sort(key=lambda x: x[0])

          lines = [
              f'translated_key_count={len(translated_keys)}',
              f'source_count={len(set(map(str, sources)))}',
              f'chinese_candidate_count={len(candidates)}',
              f'missing_count={len(missing)}',
              '',
              '=== Missing exact-match strings ==='
          ]
          for value, refs in missing:
              lines.append(f'{value} -> {refs}')

          lines.append('')
          lines.append('=== All Setting candidates ===')
          for value in sorted(candidates):
              state = 'OK' if value in translated_keys else 'MISSING'
              lines.append(f'[{state}] {value}')

          out.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Audit full Settings UI text graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          assets = Path('source/Assets')
          control = Path('control')
          out = Path('settings-full-audit.txt')

          helper = (control/'patches/settings/SettingJapaneseLayout.cs').read_text(
              encoding='utf-8-sig', errors='replace')
          prepare = (control/'patches/prepare_setting_japanese.py').read_text(
              encoding='utf-8-sig', errors='replace')

          dictionary_keys = set(re.findall(
              r'\{\s*"((?:\\.|[^"])*)"\s*,\s*"',
              helper
          ))

          chinese = re.compile(r'[\u3400-\u9fff]')
          handled = set(dictionary_keys)
          # Strings directly replaced in the Settings-only patch also count as
          # handled even though they are not dictionary entries.
          for m in re.finditer(r'["\']([^"\']*[\u3400-\u9fff][^"\']*)["\']', prepare):
              handled.add(m.group(1))

          def decode_yaml_scalar(raw):
              value = raw.strip()
              if value.startswith('"') and value.endswith('"'):
                  try:
                      return json.loads(value)
                  except Exception:
                      value = value[1:-1]
              def repl(match):
                  try:
                      return chr(int(match.group(1), 16))
                  except Exception:
                      return match.group(0)
              value = re.sub(r'\\u([0-9a-fA-F]{4})', repl, value)
              return value

          # Resolve the prefab assigned to Program.new_ui_setting and recursively
          # follow nested prefab references only (not scripts/textures/materials).
          guid_to_asset = {}
          for meta in assets.rglob('*.meta'):
              try:
                  mt = meta.read_text(encoding='utf-8-sig', errors='replace')
              except Exception:
                  continue
              gm = re.search(r'^guid:\s*([0-9a-fA-F]+)', mt, re.M)
              if gm:
                  guid_to_asset[gm.group(1)] = meta.with_suffix('')

          root_prefabs = set()
          for p in list(assets.rglob('*.prefab')) + list(assets.rglob('*.unity')):
              try:
                  text = p.read_text(encoding='utf-8-sig', errors='replace')
              except Exception:
                  continue
              for row in text.splitlines():
                  if 'new_ui_setting:' not in row:
                      continue
                  m = re.search(r'guid:\s*([0-9a-fA-F]+)', row)
                  if m:
                      target = guid_to_asset.get(m.group(1))
                      if target is not None and target.suffix == '.prefab':
                          root_prefabs.add(target)

          # Fallback/name-based candidates help if the serialized field is in a
          # binary or differently formatted asset.
          for p in assets.rglob('*.prefab'):
              if 'setting' in p.name.lower():
                  root_prefabs.add(p)

          prefab_graph = set()
          queue = list(root_prefabs)
          while queue:
              p = queue.pop()
              if p in prefab_graph or not p.is_file():
                  continue
              prefab_graph.add(p)
              try:
                  text = p.read_text(encoding='utf-8-sig', errors='replace')
              except Exception:
                  continue
              for g in re.findall(r'guid:\s*([0-9a-fA-F]+)', text):
                  target = guid_to_asset.get(g)
                  if target is not None and target.suffix == '.prefab' and target not in prefab_graph:
                      queue.append(target)

          # Related managed sources: everything in SibylSystem/Setting plus
          # source files defining the helpers/components used by this screen.
          code_files = set((assets/'SibylSystem/Setting').rglob('*.cs'))
          for p in assets.rglob('*.cs'):
              try:
                  text = p.read_text(encoding='utf-8-sig', errors='replace')
              except Exception:
                  continue
              if any(token in text for token in (
                  'class LAZYsetting', 'class SettingLayout',
                  'new_ui_setting', 'HideReplayDescriptionKey',
                  'AutoSaveReplayKey', 'DisablePhaseBarClickKey'
              )):
                  code_files.add(p)

          candidates = {}
          def add(value, ref, kind):
              value = value.strip()
              if not value or not chinese.search(value):
                  return
              if len(value) > 120:
                  return
              candidates.setdefault(value, {'refs': set(), 'kinds': set()})
              candidates[value]['refs'].add(ref)
              candidates[value]['kinds'].add(kind)

          # C# string literals.
          for p in sorted(code_files):
              try:
                  rows = p.read_text(encoding='utf-8-sig', errors='replace').splitlines()
              except Exception:
                  continue
              for lineno,row in enumerate(rows,1):
                  code = row.split('//',1)[0]
                  for m in re.finditer(r'"((?:\\.|[^"])*)"', code):
                      add(m.group(1), f'{p}:{lineno}', 'code')

          # Prefab-visible label text. Decode Unity's \uXXXX escaped scalars.
          label_prefixes = ('mText:', 'm_Text:', 'text:')
          for p in sorted(prefab_graph):
              try:
                  rows = p.read_text(encoding='utf-8-sig', errors='replace').splitlines()
              except Exception:
                  continue
              for lineno,row in enumerate(rows,1):
                  stripped = row.strip()
                  for prefix in label_prefixes:
                      if stripped.startswith(prefix):
                          add(decode_yaml_scalar(stripped[len(prefix):]),
                              f'{p}:{lineno}', 'prefab-label')
                          break

          lines = [
              f'dictionary_key_count={len(dictionary_keys)}',
              f'handled_key_count={len(handled)}',
              f'root_prefab_count={len(root_prefabs)}',
              f'prefab_graph_count={len(prefab_graph)}',
              f'code_file_count={len(code_files)}',
              f'chinese_candidate_count={len(candidates)}',
              '',
              '=== Root Settings prefabs ==='
          ]
          for p in sorted(root_prefabs):
              lines.append(str(p))
          lines.append('')
          lines.append('=== Prefab graph ===')
          for p in sorted(prefab_graph):
              lines.append(str(p))

          missing = []
          lines.append('')
          lines.append('=== All candidates ===')
          for value in sorted(candidates):
              entry = candidates[value]
              state = 'HANDLED' if value in handled else 'MISSING'
              refs = sorted(entry['refs'])
              kinds = sorted(entry['kinds'])
              lines.append(f'[{state}] {value} | kinds={kinds} | refs={refs}')
              if state == 'MISSING':
                  missing.append(value)

          lines.append('')
          lines.append(f'=== Missing ({len(missing)}) ===')
          for value in missing:
              entry = candidates[value]
              lines.append(f'{value} -> {sorted(entry["refs"])}')

          out.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Inspect Setting.cs localization timing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
